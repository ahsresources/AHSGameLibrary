<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purchasing Work System – Money Skills</title>
<meta name="description" content="Ten steps for paying at the cashier. Tap a step to watch the video.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230f8a5f'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='800' text-anchor='middle' fill='white' font-family='Arial'%3E$%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="brand-mark">$</span><span class="t">Money Skills</span></a>
    <nav class="nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="purchasing.html" aria-current="page">Purchasing</a>
      <a href="games.html">Games &amp; Apps</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <div class="head-row">
      <div class="head-icons" aria-hidden="true">
        <img src="assets/img/icon-money.png" alt="">
        <img src="assets/img/icon-cashier.png" alt="">
      </div>
      <div>
        <span class="eyebrow">Purchasing work system</span>
      </div>
    </div>
    <h1>Paying at the cashier</h1>
    <p>Follow the steps in order. Tap a step to watch how to do it.</p>
    <span class="hint">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      Tap any step to see how it's done
    </span>
  </div>

  <ol class="steps" id="steps" aria-label="Steps for paying at the cashier"></ol>
</main>

<dialog class="player" id="player" aria-labelledby="p-title">
  <div class="player-card">
    <div class="player-top">
      <span class="badge" id="p-num">1</span>
      <h2 id="p-title"></h2>
      <button class="icon-btn" id="p-close" aria-label="Close video">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="stage">
      <img class="still" id="p-still" alt="">
      <video id="p-video" controls playsinline preload="metadata"></video>
      <div class="missing" id="p-missing" role="status">
        <img id="p-missing-img" alt="">
        <p><strong id="p-missing-t">Video coming soon</strong><br>Add the file <code id="p-missing-f">assets/1.mp4</code> to show it here.</p>
      </div>
    </div>
    <div class="player-bottom">
      <button class="pbtn" id="p-prev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span class="txt">Previous</span></button>
      <div class="dots" id="p-dots" aria-hidden="true"></div>
      <button class="pbtn primary" id="p-next"><span class="txt">Next step</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </div>
</dialog>

<footer class="site-footer"><div class="wrap">Money Skills</div></footer>
<script src="js/purchasing.js"></script>
</body>
</html>
