<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flower Counting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--sky1:#BDE8F5;--sky2:#F6F9DE;--ground:#9BD878;--ground2:#79C25B;--ink:#1D4430;--muted:#4C6B58;--card:#FFFFFF;--edge:#CFE3BE;--pink:#FF5C93;--pinkd:#D93A73;--ok:#3BB273;--okd:#278A54;--tint:rgba(255,255,255,.4);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#12263A;--sky2:#1E3F45;--ground:#2A6B43;--ground2:#225A39;--ink:#E8F5E0;--muted:#A9C7B3;--card:#27413A;--edge:#355A4B;--tint:rgba(255,255,255,.06)}}
:root[data-theme="dark"]{--sky1:#12263A;--sky2:#1E3F45;--ground:#2A6B43;--ground2:#225A39;--ink:#E8F5E0;--muted:#A9C7B3;--card:#27413A;--edge:#355A4B;--tint:rgba(255,255,255,.06)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:linear-gradient(var(--sky1),var(--sky2)) fixed;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.screen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;max-width:960px;margin:0 auto}

/* Start + end */
.panel{width:min(480px,100%);background:var(--card);border-radius:28px;padding:28px 24px 26px;text-align:center;box-shadow:0 6px 0 var(--edge),0 18px 40px rgba(20,60,40,.15)}
.hero{width:96px;height:96px;margin:-64px auto 6px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18));animation:sway 4s ease-in-out infinite}
h1{font-size:2.4rem;line-height:1.1;margin:6px 0 6px;font-weight:700;letter-spacing:-.01em}
.sub{margin:0 0 22px;color:var(--muted);font-size:1.1rem}
.group{margin:0 0 18px;text-align:left}
.group>span{display:block;font-weight:600;margin:0 0 8px 4px;font-size:1.05rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--tint);border:2px solid var(--edge);padding:5px;border-radius:18px}
.seg button{padding:12px 0;border-radius:13px;font-size:1.35rem;font-weight:600;color:var(--muted);transition:background .15s,color .15s,transform .1s}
.seg button[aria-pressed="true"]{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pinkd)}
.seg button:active{transform:translateY(2px)}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--tint);border:2px solid var(--edge);padding:5px;border-radius:18px}
.step button{width:52px;height:52px;border-radius:13px;background:var(--card);box-shadow:0 3px 0 var(--edge);font-size:1.8rem;font-weight:600;line-height:1}
.step button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.step button:disabled{opacity:.35;cursor:default}
.step output{font-size:2rem;font-weight:700;min-width:3ch;text-align:center}
.cta{display:block;width:100%;padding:16px;border-radius:20px;background:var(--pink);color:#fff;font-size:1.5rem;font-weight:700;box-shadow:0 6px 0 var(--pinkd);transition:transform .1s,box-shadow .1s;margin-top:8px}
.cta:hover{filter:brightness(1.05)}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pinkd)}
.cta.alt{background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--edge);border:2px solid var(--edge)}
.cta.alt:active{box-shadow:0 2px 0 var(--edge)}
.stars{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 8px}
.stars svg{width:44px;height:44px}
.stars .miss{opacity:.25;filter:grayscale(1)}
.stars svg{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*.09s)}

/* Game */
#game{justify-content:flex-start;gap:10px;padding-top:12px;max-width:1400px}
.top{width:100%;display:flex;align-items:center;gap:10px}
.icon{width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:0 3px 0 var(--edge);display:grid;place-items:center;flex:none}
.icon:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.icon svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.prog{flex:1;text-align:center}
.prog b{font-size:1.05rem;font-weight:600;color:var(--muted)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:4px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--edge);transition:background .3s,transform .3s}
.dots i.on{background:var(--pink);transform:scale(1.25)}
.dots i.done{background:var(--ok)}
#prompt{margin:2px 0 0;font-size:clamp(1.3rem,3.6vw,1.8rem);font-weight:600;text-align:center;min-height:1.3em}
.stage{--u:1.515cqh;--ar:1.515;position:relative;container-type:size;aspect-ratio:var(--ar);width:min(100%,max(300px,calc((100dvh - 270px)*var(--ar))))}
.bush{position:absolute;left:0;top:calc(var(--u)*1);width:calc(100cqw - var(--u)*33);height:calc(var(--u)*64)}
.bush>svg{position:absolute;inset:0;width:100%;height:100%}
.fl{position:absolute;width:calc(var(--u)*12.8);aspect-ratio:1;transform:translate(-50%,-50%);z-index:5;touch-action:manipulation}
.fl::after{content:"";position:absolute;inset:-6%}
.fl .bob{display:block;width:100%;height:100%;animation:bob 3.2s ease-in-out infinite;animation-delay:var(--d);transition:scale .15s}
.fl:hover .bob{scale:1.12}
.fl.flying{z-index:30;pointer-events:none}.fl.flying .bob{animation:none}
.fl svg,.pf svg{display:block;width:100%;height:100%;filter:drop-shadow(0 calc(var(--u)*.4) calc(var(--u)*.3) rgba(0,0,0,.25))}
.ring{position:absolute;width:calc(var(--u)*12.8);aspect-ratio:1;border-radius:50%;border:calc(var(--u)*.7) solid #fff;transform:translate(-50%,-50%);animation:ring .5s ease-out forwards;pointer-events:none;z-index:4}
.crate{position:absolute;right:var(--u);top:calc(var(--u)*26);width:calc(var(--u)*31);padding:calc(var(--u)*1.6);border-radius:calc(var(--u)*1.8);background:linear-gradient(#DDA56B,#B97D43);box-shadow:0 calc(var(--u)*1.2) 0 #8C5A2B,0 calc(var(--u)*2.4) calc(var(--u)*2.4) rgba(0,0,0,.25);z-index:2}
.crate::before{content:"";position:absolute;left:8%;right:8%;bottom:calc(var(--u)*-3.6);height:calc(var(--u)*1.8);border-radius:50%;background:rgba(0,0,0,.14);z-index:-1}
.tray{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--u)*.6);padding:var(--u);border-radius:calc(var(--u)*1.1);background:linear-gradient(#6A4122,#7C4F2B);box-shadow:inset 0 calc(var(--u)*.5) calc(var(--u)*.8) rgba(0,0,0,.4)}
.slot{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.09);box-shadow:inset 0 calc(var(--u)*.2) calc(var(--u)*.4) rgba(0,0,0,.3)}
.pf{width:100%;height:100%;animation:land .4s cubic-bezier(.3,1.7,.5,1)}
.answers{width:min(100%,640px);display:grid;grid-template-columns:repeat(4,1fr);gap:10px;opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .3s,transform .3s}
.answers.ready{opacity:1;transform:none;pointer-events:auto}
.answers button{padding:12px 0;border-radius:20px;background:var(--card);border:2px solid var(--edge);box-shadow:0 6px 0 var(--edge);font-size:clamp(1.8rem,7vw,2.6rem);font-weight:700;transition:transform .1s,box-shadow .1s,background .2s,color .2s}
.answers button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--edge)}
.answers button.right{background:var(--ok);color:#fff;border-color:var(--okd);box-shadow:0 6px 0 var(--okd);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.answers button.wrong{opacity:.35;box-shadow:none;transform:translateY(4px);animation:shake .4s;pointer-events:none}
.answers button:disabled{cursor:default}
.pt{position:fixed;left:0;top:0;width:14px;height:20px;border-radius:50%;pointer-events:none;z-index:99}

@keyframes bob{0%,100%{rotate:-3deg}50%{rotate:3deg}}
@keyframes sway{0%,100%{rotate:-5deg}50%{rotate:5deg}}
@keyframes ring{from{opacity:.9;scale:.6}to{opacity:0;scale:1.9}}
@keyframes land{from{scale:1.5}to{scale:1}}
@keyframes pop{from{scale:.4;opacity:0}60%{scale:1.15}to{scale:1;opacity:1}}
@keyframes shake{20%,60%{translate:-6px 0}40%,80%{translate:6px 0}}
@media (prefers-reduced-motion:reduce){.fl .bob,.hero{animation:none}.stars svg,.pf,.answers button.right,.answers button.wrong{animation:none}}
</style>
</head>
<body>

<main id="start" class="screen">
  <section class="panel">
    <div class="hero" id="hero"></div>
    <h1>Flower Counting</h1>
    <p class="sub">Pick the flowers, then count them.</p>
    <div class="group" role="group" aria-labelledby="l1">
      <span id="l1">How many flowers?</span>
      <div class="seg" id="range">
        <button data-max="5" aria-pressed="true">1 to 5</button>
        <button data-max="10" aria-pressed="false">1 to 10</button>
      </div>
    </div>
    <div class="group" role="group" aria-labelledby="l2">
      <span id="l2">Rounds</span>
      <div class="step">
        <button id="minus" aria-label="Fewer rounds">−</button>
        <output id="rounds" aria-live="polite">5</output>
        <button id="plus" aria-label="More rounds">+</button>
      </div>
    </div>
    <button class="cta" id="play">Play</button>
  </section>
</main>

<main id="game" class="screen" hidden>
  <div class="top">
    <button class="icon" id="home" aria-label="Back to start"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="prog"><b id="rlabel">Round 1 of 5</b><div class="dots" id="dots"></div></div>
    <button class="icon" id="snd" aria-label="Sound on" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="waves" d="M16.5 9a4 4 0 010 6M19 6.5a8 8 0 010 11"/><path id="slash" d="M17 9l5 6M22 9l-5 6" hidden/></svg></button>
  </div>
  <p id="prompt" aria-live="polite">Tap each flower to pick it.</p>
  <div class="stage" id="stage">
    <div class="bush">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <ellipse cx="50" cy="93" rx="42" ry="5" fill="rgba(0,0,0,.14)"/>
        <g fill="#1F6A3C"><circle cx="22" cy="64" r="22"/><circle cx="78" cy="64" r="22"/><circle cx="50" cy="47" r="32"/><circle cx="50" cy="72" r="24"/><circle cx="31" cy="46" r="21"/><circle cx="69" cy="46" r="21"/></g>
        <g fill="#2E8B4F"><circle cx="22" cy="60" r="19"/><circle cx="78" cy="60" r="19"/><circle cx="50" cy="43" r="28"/><circle cx="50" cy="68" r="21"/><circle cx="31" cy="42" r="18"/><circle cx="69" cy="42" r="18"/></g>
        <g fill="#4DB26B" opacity=".75"><ellipse cx="38" cy="30" rx="9" ry="4" transform="rotate(-25 38 30)"/><ellipse cx="64" cy="26" rx="9" ry="4" transform="rotate(20 64 26)"/><ellipse cx="14" cy="52" rx="8" ry="3.5" transform="rotate(-50 14 52)"/><ellipse cx="86" cy="52" rx="8" ry="3.5" transform="rotate(50 86 52)"/><ellipse cx="50" cy="84" rx="10" ry="4"/><ellipse cx="26" cy="78" rx="8" ry="3.5" transform="rotate(30 26 78)"/><ellipse cx="74" cy="78" rx="8" ry="3.5" transform="rotate(-30 74 78)"/></g>
      </svg>
      <div id="flowers"></div>
    </div>
    <div class="crate" aria-hidden="true"><div class="tray" id="tray"></div></div>
  </div>
  <div class="answers" id="answers" role="group" aria-label="How many flowers?"></div>
</main>

<main id="end" class="screen" hidden>
  <section class="panel">
    <h1 id="endTitle">All done!</h1>
    <p class="sub" id="endSub"></p>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <button class="cta" id="again">Play again</button>
    <button class="cta alt" id="settings">Change settings</button>
  </section>
</main>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const SPOTS=[[38,27],[62,27],[14,50],[38,50],[62,50],[86,50],[14,73],[38,73],[62,73],[86,73]];
const petals=[0,1,2,3,4,5].map(i=>`<ellipse cx="0" cy="-23" rx="13" ry="21" transform="rotate(${i*60})" fill="#FF6F9F" stroke="#E04A80" stroke-width="2"/><ellipse cx="0" cy="-27" rx="5" ry="10" transform="rotate(${i*60})" fill="#FF9DBF"/>`).join('');
const FLOWER=`<svg viewBox="-50 -50 100 100" aria-hidden="true">${petals}<circle r="13" fill="#FFD23F" stroke="#E8A91A" stroke-width="2"/><circle cx="-4" cy="-4" r="3.5" fill="#FFF0A6"/></svg>`;
$('#hero').innerHTML=FLOWER;

const S={max:5,rounds:5,round:0,n:0,last:0,picked:0,landed:0,first:true,results:[],slots:[],busy:false};
let muted=false,ac=null;

/* Sound */
function ctx(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function tone(f,t,d,type,g,f2){const a=ctx();if(!a)return;const o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function sPluck(i){if(muted)return;const a=ctx();if(!a)return;const t=a.currentTime,f=380+i*42;tone(f,t,.13,'sine',.28,f*2);tone(f*2,t+.03,.08,'triangle',.07)}
function sCorrect(){if(muted)return;const a=ctx();if(!a)return;const t=a.currentTime;[523,659,784,1047].forEach((f,i)=>{tone(f,t+i*.11,.35,'triangle',.2);tone(f*2,t+i*.11,.25,'sine',.05)})}

/* Screens */
function fit(){const g=$('#game');if(g.hidden)return;const w=g.clientWidth-32,h=Math.max(innerHeight-270,200);$('#stage').style.setProperty('--ar',Math.max(1.515,Math.min(2.1,w/h)).toFixed(3))}
addEventListener('resize',fit);
function show(id){['start','game','end'].forEach(s=>$('#'+s).hidden=s!==id);window.scrollTo(0,0);fit()}

/* Start screen */
document.querySelectorAll('#range button').forEach(b=>b.onclick=()=>{S.max=+b.dataset.max;document.querySelectorAll('#range button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
function rounds(d){S.rounds=Math.max(3,Math.min(10,S.rounds+d));$('#rounds').textContent=S.rounds;$('#minus').disabled=S.rounds<=3;$('#plus').disabled=S.rounds>=10}
$('#minus').onclick=()=>rounds(-1);$('#plus').onclick=()=>rounds(1);rounds(0);
$('#play').onclick=start;$('#again').onclick=start;
$('#settings').onclick=()=>show('start');$('#home').onclick=()=>{S.busy=true;show('start')};
$('#snd').onclick=()=>{muted=!muted;$('#snd').setAttribute('aria-pressed',muted);$('#snd').setAttribute('aria-label',muted?'Sound off':'Sound on');$('#waves').hidden=muted;$('#slash').hidden=!muted};

/* Game */
function start(){ctx();S.round=0;S.results=[];S.last=0;S.busy=false;show('game');nextRound()}
function nextRound(){
  S.round++;S.first=true;S.picked=0;S.landed=0;
  let n;do{n=rnd(1,S.max)}while(n===S.last&&S.max>1);S.n=n;S.last=n;
  $('#rlabel').textContent=`Round ${S.round} of ${S.rounds}`;
  $('#dots').innerHTML=Array.from({length:S.rounds},(_,i)=>`<i class="${i<S.round-1?'done':i===S.round-1?'on':''}"></i>`).join('');
  $('#prompt').textContent='Tap each flower to pick it.';
  const ans=$('#answers');ans.classList.remove('ready');ans.innerHTML='';
  const tray=$('#tray'),bush=$('#flowers');tray.innerHTML='';bush.innerHTML='';S.slots=[];
  for(let i=0;i<(S.max>5?10:5);i++){const s=document.createElement('div');s.className='slot';tray.append(s);S.slots.push(s)}
  shuffle(SPOTS.slice()).slice(0,n).forEach(([x,y])=>{
    const b=document.createElement('button');b.className='fl';b.setAttribute('aria-label','Pick flower');
    b.style.left=(x+rnd(-1,1))+'%';b.style.top=(y+rnd(-1,1))+'%';
    b.innerHTML=`<span class="bob" style="--d:${(-Math.random()*3).toFixed(2)}s">${FLOWER}</span>`;
    b.onclick=()=>pluck(b);bush.append(b)});
}
function pluck(el){
  if(el.dataset.done||S.busy)return;el.dataset.done=1;
  const i=S.picked++,slot=S.slots[i];sPluck(i);
  const a=el.getBoundingClientRect(),b=slot.getBoundingClientRect();
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2),sc=b.width/a.width;
  const ring=document.createElement('span');ring.className='ring';ring.style.left=el.style.left;ring.style.top=el.style.top;el.parentNode.append(ring);setTimeout(()=>ring.remove(),500);
  el.classList.add('flying');
  const T=n=>`translate(-50%,-50%) translate(${dx*n}px,${dy*n}px)`;
  const lift=Math.max(40,Math.abs(dx)*.15);
  const anim=el.animate([
    {transform:`${T(0)} scale(1) rotate(0deg)`,easing:'cubic-bezier(.2,.7,.4,1)'},
    {transform:`${T(.45)} translateY(${-lift}px) scale(${1+(sc-1)*.3+.15}) rotate(160deg)`,offset:.45,easing:'cubic-bezier(.5,0,.8,.6)'},
    {transform:`${T(1)} scale(${sc}) rotate(360deg)`}
  ],{duration:720,fill:'forwards'});
  anim.onfinish=()=>{
    const f=document.createElement('div');f.className='pf';f.innerHTML=FLOWER;slot.append(f);el.remove();
    if(++S.landed===S.n)setTimeout(ready,300)};
}
function ready(){
  if(S.busy)return;
  $('#prompt').textContent='How many flowers are in the box?';
  const pool=[];for(let i=1;i<=S.max;i++)if(i!==S.n)pool.push([i,Math.abs(i-S.n)+Math.random()*2.5]);
  const opts=pool.sort((a,b)=>a[1]-b[1]).slice(0,3).map(p=>p[0]).concat(S.n).sort((a,b)=>a-b);
  const ans=$('#answers');ans.innerHTML='';
  opts.forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>answer(b,v);ans.append(b)});
  requestAnimationFrame(()=>ans.classList.add('ready'));
}
function answer(btn,v){
  if(v!==S.n){S.first=false;btn.classList.add('wrong');btn.disabled=true;return}
  sCorrect();S.results.push(S.first);btn.classList.add('right');
  document.querySelectorAll('#answers button').forEach(b=>{b.disabled=true;if(b!==btn)b.style.opacity=.35});
  setTimeout(()=>{if(S.busy)return;S.round>=S.rounds?finish():nextRound()},1500);
}
function burst(btn){
  const r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cols=['#FF6F9F','#FFD23F','#FFFFFF','#9BD878'];
  for(let i=0;i<22;i++){
    const p=document.createElement('i');p.className='pt';p.style.background=cols[i%4];document.body.append(p);
    const ang=Math.random()*Math.PI*2,d=70+Math.random()*130,x=Math.cos(ang)*d,y=Math.sin(ang)*d-60;
    p.animate([{transform:`translate(${cx}px,${cy}px) rotate(0)`,opacity:1},{transform:`translate(${cx+x}px,${cy+y}px) rotate(${rnd(-300,300)}deg)`,opacity:1,offset:.6},{transform:`translate(${cx+x}px,${cy+y+90}px) rotate(${rnd(-500,500)}deg)`,opacity:0}],{duration:900+Math.random()*500,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>p.remove();
  }
}
function finish(){
  const s=S.results.filter(Boolean).length,t=S.rounds;
  $('#endTitle').textContent=s===t?'Perfect counting!':s>=t/2?'Great counting!':'Nice work!';
  $('#endSub').textContent=`You got ${s} of ${t} right on the first try.`;
  $('#stars').innerHTML=S.results.map((ok,i)=>`<span style="display:contents">${FLOWER.replace('<svg','<svg style="--i:'+i+'"'+(ok?'':' class="miss"'))}</span>`).join('');
  show('end');if(s>0)sCorrect();
}
})();
</script>
</body>
</html>
