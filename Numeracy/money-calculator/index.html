<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f4f7fa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Money Calculator"><title>Money Calculator</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><style>:root{--bg:#f4f7fa;--card:#fff;--text:#171a1f;--muted:#5f6873;--line:#dfe5eb;--shadow:0 2px 10px rgba(20,28,38,.06);--radius:22px}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}button{font:inherit}.app{width:min(100%,1100px);margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}h1{margin:2px 0 18px;text-align:center;font-size:clamp(30px,5vw,44px);line-height:1.1;letter-spacing:-.02em}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.total-card{text-align:center;padding:20px 18px 22px;margin-bottom:14px}.eyebrow{margin:0 0 5px;color:var(--muted);font-weight:800;font-size:14px;letter-spacing:.12em}#total{margin:0;font-variant-numeric:tabular-nums;font-size:clamp(54px,12vw,88px);line-height:1;font-weight:800;letter-spacing:-.04em}.selected-card{padding:17px 16px 18px;min-height:130px;margin-bottom:18px}.selected-heading{margin:0 0 12px;font-size:15px;letter-spacing:.08em;font-weight:800;color:var(--muted)}#selectedCoins{min-height:72px;display:flex;align-items:center;align-content:flex-start;gap:8px;flex-wrap:wrap}.empty-state{color:#8a939d;font-size:16px}.selected-coin{width:60px;height:60px;object-fit:contain;display:block;flex:0 0 auto}.coin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}.coin-button{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);min-height:178px;padding:15px 10px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text);cursor:pointer;touch-action:manipulation}.coin-button:active{transform:scale(.985)}.coin-button:focus-visible{outline:4px solid #6aa9ff;outline-offset:2px}.coin-image-wrap{width:min(120px,30vw);height:min(120px,30vw);display:grid;place-items:center}.coin-button img{width:100%;height:100%;display:block;object-fit:contain}.coin-label{font-size:clamp(20px,4.7vw,26px);line-height:1.05;font-weight:800;text-align:center}.clear-button{width:100%;min-height:68px;border:2px solid #252a31;border-radius:20px;background:#252a31;color:#fff;font-weight:800;font-size:24px;letter-spacing:.02em;cursor:pointer;touch-action:manipulation}.clear-button:active{transform:scale(.99)}.clear-button:focus-visible{outline:4px solid #6aa9ff;outline-offset:2px}@media(min-width:700px) and (min-height:600px){.app{padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right))}.coin-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.coin-button{min-height:230px}.coin-image-wrap{width:min(150px,18vw);height:min(150px,18vw)}.selected-coin{width:68px;height:68px}}@media(max-height:520px) and (orientation:landscape){.app{padding-top:max(10px,env(safe-area-inset-top))}h1{font-size:28px;margin-bottom:10px}.total-card{padding:12px 14px 14px;margin-bottom:10px}#total{font-size:50px}.selected-card{min-height:90px;padding:10px 12px;margin-bottom:10px}#selectedCoins{min-height:48px}.selected-coin{width:44px;height:44px}.coin-button{min-height:134px;padding:9px}.coin-image-wrap{width:82px;height:82px}.coin-label{font-size:19px}.clear-button{min-height:56px;font-size:21px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}</style></head><body><main class="app"><h1>Money Calculator</h1><section class="card total-card" aria-labelledby="totalLabel"><p class="eyebrow" id="totalLabel">TOTAL</p><p id="total" aria-live="polite">$0.00</p></section><section class="card selected-card" aria-labelledby="selectedHeading"><h2 class="selected-heading" id="selectedHeading">COINS SELECTED</h2><div id="selectedCoins" aria-live="polite"><span class="empty-state">No coins selected</span></div></section><section class="coin-grid" aria-label="Choose a coin"><button class="coin-button" type="button" data-cents="10" data-image="./images/10-cent.png" aria-label="Add 10 cents"><span class="coin-image-wrap"><img src="./images/10-cent.png" alt="Singapore 10 cent coin"></span><span class="coin-label">10 cents</span></button><button class="coin-button" type="button" data-cents="20" data-image="./images/20-cent.png" aria-label="Add 20 cents"><span class="coin-image-wrap"><img src="./images/20-cent.png" alt="Singapore 20 cent coin"></span><span class="coin-label">20 cents</span></button><button class="coin-button" type="button" data-cents="50" data-image="./images/50-cent.png" aria-label="Add 50 cents"><span class="coin-image-wrap"><img src="./images/50-cent.png" alt="Singapore 50 cent coin"></span><span class="coin-label">50 cents</span></button><button class="coin-button" type="button" data-cents="100" data-image="./images/1-dollar.png" aria-label="Add 1 dollar"><span class="coin-image-wrap"><img src="./images/1-dollar.png" alt="Singapore 1 dollar coin"></span><span class="coin-label">1 dollar</span></button></section><button id="clearButton" class="clear-button" type="button">CLEAR</button></main><script>(()=>{let totalCents=0;const totalEl=document.getElementById('total'),selectedEl=document.getElementById('selectedCoins'),clearButton=document.getElementById('clearButton');function updateTotal(){totalEl.textContent=`$${(totalCents/100).toFixed(2)}`}function removeEmptyState(){const empty=selectedEl.querySelector('.empty-state');if(empty)empty.remove()}document.querySelectorAll('.coin-button').forEach(button=>{button.addEventListener('click',()=>{const cents=Number(button.dataset.cents),src=button.dataset.image,sourceImg=button.querySelector('img');totalCents+=cents;updateTotal();removeEmptyState();const img=document.createElement('img');img.className='selected-coin';img.src=src;img.alt=sourceImg.alt;selectedEl.appendChild(img)})});clearButton.addEventListener('click',()=>{totalCents=0;updateTotal();selectedEl.replaceChildren();const empty=document.createElement('span');empty.className='empty-state';empty.textContent='No coins selected';selectedEl.appendChild(empty)});if('serviceWorker'in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js').catch(()=>{})})})();</script></body></html>
