<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Something Happened! WH-Detective</title>
<style>
  :root{
    --bg1:#fdf6ec; --bg2:#eaf6f6; --pink:#ffc9de; --peach:#ffd9b3; --mint:#c8f0e0;
    --sky:#c9e8fb; --lav:#e3d3f7; --sun:#fff2b8; --ink:#4a4a5a; --green:#8fd6a8;
    --red:#ff9e9e; --grey:#d9d9e3; --shadow:0 6px 0 rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;
    font-family:-apple-system, "Segoe UI Rounded", "Segoe UI", Verdana, sans-serif;
    background:linear-gradient(160deg, var(--bg1), var(--bg2));
    color:var(--ink); touch-action:manipulation;}
  #app{position:relative; width:100%; height:100%; overflow:hidden;}
  .screen{position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:flex-start; padding:16px; overflow-y:auto;}
  .screen.active{display:flex;}
  h1{font-size:clamp(24px,5vw,42px); margin:8px 0 4px; text-align:center; color:#6b5b95;}
  h2{font-size:clamp(18px,3.5vw,28px); margin:6px 0; text-align:center;}
  p.sub{font-size:clamp(14px,2.5vw,20px); text-align:center; margin:0 0 12px; opacity:.8;}
  .bigBtn{
    font-size:clamp(18px,3vw,26px); font-weight:700; border:none; border-radius:24px;
    padding:18px 32px; margin:8px; cursor:pointer; box-shadow:var(--shadow);
    transition:transform .08s ease; min-width:140px; color:var(--ink);
  }
  .bigBtn:active{transform:translateY(5px); box-shadow:0 1px 0 rgba(0,0,0,0.08);}
  .btn-pink{background:var(--pink);} .btn-peach{background:var(--peach);}
  .btn-mint{background:var(--mint);} .btn-sky{background:var(--sky);}
  .btn-lav{background:var(--lav);} .btn-sun{background:var(--sun);}
  .btn-grey{background:var(--grey);}
  .row{display:flex; flex-wrap:wrap; justify-content:center; align-items:center;}
  .card{background:#fffdfa; border-radius:28px; box-shadow:var(--shadow);
    padding:20px; margin:10px; max-width:640px; width:100%;}
  #gearBtn{position:absolute; top:12px; right:12px; z-index:50; font-size:30px;
    background:rgba(255,255,255,0.7); border:none; border-radius:50%; width:52px; height:52px;
    box-shadow:var(--shadow); cursor:pointer;}
  #navLeft{position:absolute; top:12px; left:12px; z-index:50; display:none; gap:8px;}
  .navBtn{font-size:16px; font-weight:800; background:rgba(255,255,255,0.85); border:none;
    border-radius:20px; height:44px; padding:0 16px; box-shadow:var(--shadow); cursor:pointer; color:var(--ink);}
  .navBtn:active{transform:translateY(2px);}
  .stage{width:100%; max-width:560px; height:min(38vh,300px); background:#fff;
    border-radius:28px; box-shadow:var(--shadow); position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center; margin:10px 0;}
  .sceneEmoji{font-size:clamp(60px,12vw,110px); position:relative;
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
  .sceneEmoji svg{width:clamp(90px,22vw,180px); height:clamp(90px,22vw,180px);}
  .sceneEmoji img, .sceneEmoji video{max-width:92%; max-height:92%; border-radius:18px; object-fit:contain;
    width:auto; height:auto; background:#111;}
  .videoWrap{position:relative; width:92%; height:92%; display:flex; align-items:center; justify-content:center;}
  .videoWrap video{width:100%; height:100%; border-radius:18px; object-fit:contain; background:#111;}
  .tapToPlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.25); border-radius:18px; cursor:pointer;}
  .tapToPlay .playIcon{width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,0.9);
    display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:var(--shadow);}
  .fsBtn{position:absolute; top:8px; right:8px; width:38px; height:38px; border:none; border-radius:10px;
    background:rgba(255,255,255,0.85); font-size:18px; cursor:pointer; box-shadow:var(--shadow); z-index:5;
    display:flex; align-items:center; justify-content:center;}
  .fsBtn:active{transform:translateY(2px);}
  .videoErrorNote{position:absolute; bottom:6px; left:6px; right:6px; background:rgba(255,255,255,0.92);
    border-radius:10px; padding:4px 8px; font-size:11px; text-align:center; color:#b91c1c; font-weight:700;}
  .mediaWarning{font-size:11px; color:#b91c1c; font-weight:700; margin-top:2px;}
  .previewBtn{margin-left:auto;}
  .previewSlot:empty{display:none;}
  .choiceIcon{display:inline-flex; align-items:center; justify-content:center; margin-bottom:6px;}
  .choiceIcon svg{width:clamp(40px,7vw,64px); height:clamp(40px,7vw,64px);}
  .choiceIcon img{width:clamp(44px,8vw,70px); height:clamp(44px,8vw,70px); object-fit:cover; border-radius:12px;}
  .speechBubble{background:#fff; border-radius:22px; padding:14px 22px; box-shadow:var(--shadow);
    font-size:clamp(16px,3vw,22px); text-align:center; max-width:560px; margin:6px 0 14px; font-weight:700;}
  .choiceGrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:14px; width:100%; max-width:640px; margin-top:6px;}
  .whChoice{font-size:clamp(18px,2.6vw,24px); font-weight:800; border:none; border-radius:22px;
    padding:18px 16px; box-shadow:var(--shadow); cursor:pointer; transition:transform .08s ease;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    min-height:110px; text-align:center; line-height:1.28;}
  .whChoice.longText{font-size:clamp(14px,2vw,18px); line-height:1.3;}
  .whChoice:active{transform:translateY(5px); box-shadow:0 1px 0 rgba(0,0,0,0.08);}
  .whChoice.correctGlow{animation:glow 1.1s infinite;}
  @keyframes glow{0%,100%{box-shadow:var(--shadow), 0 0 0 0 rgba(255,214,102,0);}
    50%{box-shadow:var(--shadow), 0 0 22px 8px rgba(255,214,102,0.9);}}
  .revealPanel{background:#fff; border-radius:26px; padding:18px 22px; box-shadow:var(--shadow);
    text-align:center; max-width:560px; margin-top:10px;}
  .revealPanel .emoji{font-size:56px;}
  .progressBar{width:100%; max-width:500px; height:16px; background:#eee; border-radius:10px;
    overflow:hidden; margin:6px 0 14px;}
  .progressFill{height:100%; background:linear-gradient(90deg,#ffc9de,#c8f0e0); width:0%;
    transition:width .4s ease;}
  .settingsGrid{display:flex; flex-direction:column; gap:10px; width:100%; max-width:520px;}
  .settingsRow{display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:#fff; border-radius:18px; padding:10px 16px; box-shadow:var(--shadow); flex-wrap:wrap;}
  .settingsRow label{font-weight:700; font-size:15px;}
  .settingsRow .opts{display:flex; gap:6px; flex-wrap:wrap;}
  .miniBtn{border:none; border-radius:14px; padding:8px 14px; font-weight:700; cursor:pointer;
    background:var(--grey); font-size:14px;}
  .miniBtn.on{background:var(--green); color:#fff;}
  .levelChecks{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
  .levelChk{display:flex; align-items:center; gap:6px; background:#fff; border-radius:16px;
    padding:8px 12px; box-shadow:var(--shadow); font-weight:700; font-size:14px; cursor:pointer;}
  .levelChk input{width:18px;height:18px;}
  #confettiCanvas{position:absolute; inset:0; pointer-events:none; z-index:60;}
  .tokenTray{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:8px; max-width:560px;}
  .token{background:#fff; border-radius:14px; padding:10px 14px; font-weight:700; font-size:16px;
    box-shadow:var(--shadow); cursor:pointer;}
  .token.used{opacity:.25; pointer-events:none;}
  .sentenceStrip{min-height:56px; width:100%; max-width:560px; background:#fff; border-radius:16px;
    box-shadow:var(--shadow); display:flex; align-items:center; flex-wrap:wrap; gap:6px;
    padding:8px 12px; margin-top:10px; font-weight:700; font-size:18px;}
  .starRow{font-size:34px; letter-spacing:6px;}
  footer.tiny{font-size:11px; opacity:.5; margin-top:auto; padding-top:10px; text-align:center;}
  .mediaManager{display:flex; flex-direction:column; gap:10px; width:100%; max-width:520px;}
  .mediaRow.mediaCard{display:flex; flex-direction:column; align-items:stretch; gap:8px;
    background:#fff; border-radius:18px; padding:12px 14px; box-shadow:var(--shadow);}
  .mediaTopLine{display:flex; align-items:center; gap:12px;}
  .mediaThumb{width:54px; height:54px; border-radius:12px; background:#f5f5f5; display:flex;
    align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;}
  .mediaThumb svg{width:80%; height:80%;} .mediaThumb img{width:100%; height:100%; object-fit:cover;}
  .mediaTopLine .status{font-size:12px; opacity:.65;}
  .mediaFields{display:flex; flex-direction:column; gap:6px;}
  .mediaField{display:flex; align-items:center; gap:8px;}
  .mediaFieldLabel{font-size:12px; font-weight:700; opacity:.7; width:60px; flex-shrink:0;}
  .mediaFieldInput{flex:1; border:2px solid #eee; border-radius:12px; padding:7px 10px;
    font-size:14px; font-family:inherit;}
  .mediaActions{display:flex; gap:6px; flex-wrap:wrap;}
  .fileBtn{position:relative; overflow:hidden; display:inline-block;}
  .fileBtn input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;}
</style>
</head>
<body>
<div id="app">
  <canvas id="confettiCanvas"></canvas>
  <button id="gearBtn" title="Teacher Settings">⚙️</button>
  <div id="navLeft">
    <button id="backBtn" class="navBtn" title="Back one step">← Back</button>
    <button id="homeBtn" class="navBtn" title="Go to main page">🏠 Home</button>
  </div>

  <!-- START SCREEN -->
  <div class="screen active" id="screen-start">
    <h1>🕵️ Something Happened!</h1>
    <p class="sub">A WH-Question Detective Game</p>
    <div class="stage"><div class="sceneEmoji" id="startEmoji">🔍</div></div>
    <button class="bigBtn btn-mint" id="startPlayBtn">▶️ Start Playing</button>
    <footer class="tiny">Rainbow Centre · AHS Game Library · Offline single-file game</footer>
  </div>

  <!-- SETTINGS SCREEN -->
  <div class="screen" id="screen-settings">
    <h2>⚙️ Teacher Settings</h2>
    <div class="settingsGrid" id="settingsGrid"></div>
    <div class="row" style="margin-top:14px;">
      <button class="bigBtn btn-mint" id="settingsSaveBtn">✅ Save &amp; Back</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen" id="screen-game">
    <div class="progressBar"><div class="progressFill" id="progressFill"></div></div>
    <div class="stage"><div class="sceneEmoji" id="gameEmoji">❓</div></div>
    <div class="speechBubble" id="speechBubble">Get ready...</div>
    <div class="choiceGrid" id="choiceGrid"></div>
    <div class="tokenTray" id="tokenTray" style="display:none;"></div>
    <div class="sentenceStrip" id="sentenceStrip" style="display:none;"></div>
    <div class="revealPanel" id="revealPanel" style="display:none;">
      <div class="emoji" id="revealEmoji">🎉</div>
      <div id="revealAnswer" style="font-size:clamp(18px,3vw,24px);font-weight:800;color:#4a4a5a;margin:6px 0 2px;"></div>
      <div id="revealText"></div>
      <button class="bigBtn btn-mint" id="nextRoundBtn">Next ➜</button>
    </div>
  </div>

  <!-- SUMMARY SCREEN -->
  <div class="screen" id="screen-summary">
    <h1>🎉 Great Detective Work!</h1>
    <div class="starRow" id="starRow">⭐⭐⭐</div>
    <p class="sub" id="summaryText"></p>
    <div class="row">
      <button class="bigBtn btn-mint" id="playAgainBtn">▶️ Play Again</button>
    </div>
  </div>
</div>
<script>
/* ================= AUDIO ENGINE ================= */
let actx=null, audioUnlocked=false, speechUnlocked=false;
function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==='suspended'){ actx.resume(); } }
function tone(freq,delay,dur,type='sine',vol=0.22,freqEnd=null){
  if(!actx||!SETTINGS.sound) return;
  const t0=actx.currentTime+delay;
  const osc=actx.createOscillator(); const gain=actx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(freq,t0);
  if(freqEnd!==null) osc.frequency.linearRampToValueAtTime(freqEnd,t0+dur);
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(vol,t0+Math.min(0.03,dur/4));
  gain.gain.linearRampToValueAtTime(0,t0+dur);
  osc.connect(gain); gain.connect(actx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sequence(list){ list.forEach(n=>tone(n.freq,n.delay,n.dur,n.type||'sine',n.vol||0.22,n.freqEnd||null)); }
function noiseBurst(delay,dur,filterFreq=1200,vol=0.28,filterType='lowpass'){
  if(!actx||!SETTINGS.sound) return;
  const t0=actx.currentTime+delay;
  const bufferSize=Math.floor(actx.sampleRate*dur);
  const buffer=actx.createBuffer(1,bufferSize,actx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i]=(Math.random()*2-1)*(1-i/bufferSize); }
  const src=actx.createBufferSource(); src.buffer=buffer;
  const filt=actx.createBiquadFilter(); filt.type=filterType; filt.frequency.value=filterFreq;
  const gain=actx.createGain(); gain.gain.setValueAtTime(vol,t0); gain.gain.linearRampToValueAtTime(0,t0+dur);
  src.connect(filt); filt.connect(gain); gain.connect(actx.destination);
  src.start(t0); src.stop(t0+dur+0.02);
}
const SOUNDS={
  crash:()=>{ noiseBurst(0,0.25,900,0.3); tone(180,0.02,0.3,'triangle',0.2,90); },
  pop:()=>{ tone(700,0,0.12,'sine',0.22,500); },
  chirp:()=>{ tone(1200,0,0.09,'sine',0.18,1900); tone(1500,0.13,0.09,'sine',0.16,2200); },
  buzz:()=>{ tone(120,0,0.35,'square',0.15,60); },
  footsteps:()=>{ sequence([{freq:150,delay:0,dur:0.08,type:'square',vol:0.15},{freq:150,delay:0.22,dur:0.08,type:'square',vol:0.15},{freq:150,delay:0.44,dur:0.08,type:'square',vol:0.15}]); },
  knock:()=>{ sequence([{freq:140,delay:0,dur:0.1,type:'square',vol:0.22},{freq:140,delay:0.28,dur:0.1,type:'square',vol:0.22}]); },
  chime:()=>{ sequence([{freq:660,delay:0,dur:0.2,type:'sine',vol:0.2},{freq:880,delay:0.15,dur:0.25,type:'sine',vol:0.2}]); },
  bell:()=>{ tone(880,0,0.6,'sine',0.2,440); },
  siren:()=>{ tone(500,0,0.5,'sawtooth',0.16,900); tone(900,0.5,0.5,'sawtooth',0.16,500); tone(500,1.0,0.5,'sawtooth',0.16,900); },
  rain:()=>{ noiseBurst(0,1.4,2200,0.16,'bandpass'); noiseBurst(0.3,1.1,1800,0.13,'bandpass'); },
  sad:()=>{ tone(300,0,0.35,'sine',0.15,220); tone(220,0.35,0.4,'sine',0.13,160); },
  whistle:()=>{ tone(1500,0,0.5,'sine',0.2,1800); },
  engine:()=>{ tone(90,0,0.6,'sawtooth',0.12,110); },
  fanfare:()=>{ sequence([{freq:523,delay:0,dur:0.18,type:'triangle',vol:0.2},{freq:659,delay:0.16,dur:0.18,type:'triangle',vol:0.2},{freq:784,delay:0.32,dur:0.3,type:'triangle',vol:0.22}]); },
  splash:()=>{ noiseBurst(0,0.35,1500,0.3); },
  success:()=>{ sequence([{freq:523,delay:0,dur:0.14,type:'sine',vol:0.2},{freq:659,delay:0.12,dur:0.14,type:'sine',vol:0.2},{freq:784,delay:0.24,dur:0.14,type:'sine',vol:0.2},{freq:1047,delay:0.36,dur:0.25,type:'sine',vol:0.22}]); },
  gentle:()=>{ tone(300,0,0.18,'sine',0.14,260); tone(260,0.2,0.2,'sine',0.13,220); },
  tada:()=>{ sequence([{freq:523,delay:0,dur:0.12,type:'triangle',vol:0.2},{freq:659,delay:0.1,dur:0.12,type:'triangle',vol:0.2},{freq:784,delay:0.2,dur:0.12,type:'triangle',vol:0.2},{freq:1047,delay:0.32,dur:0.4,type:'triangle',vol:0.24}]); }
};
function playSound(name){ if(SOUNDS[name]) SOUNDS[name](); }

/* ================= SPEECH ================= */
function speak(text){
  if(!SETTINGS.speech) return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.rate=0.92; u.pitch=1.05;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function unlockAudioAndSpeech(){
  ensureAudio();
  if(!speechUnlocked){
    try{ const u=new SpeechSynthesisUtterance(' '); window.speechSynthesis.speak(u); }catch(e){}
    speechUnlocked=true;
  }
  audioUnlocked=true;
}

/* ================= CONFETTI ================= */
const confettiCanvas=document.getElementById('confettiCanvas');
const cctx=confettiCanvas.getContext('2d');
let confettiPieces=[];
function resizeCanvas(){ confettiCanvas.width=window.innerWidth; confettiCanvas.height=window.innerHeight; }
window.addEventListener('resize',resizeCanvas); resizeCanvas();
function burstConfetti(){
  const colors=['#ffc9de','#ffd9b3','#c8f0e0','#c9e8fb','#e3d3f7','#fff2b8'];
  for(let i=0;i<70;i++){
    confettiPieces.push({
      x:confettiCanvas.width/2, y:confettiCanvas.height*0.35,
      vx:(Math.random()-0.5)*10, vy:Math.random()*-8-2,
      g:0.35, size:6+Math.random()*6, color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360, vr:(Math.random()-0.5)*10, life:100
    });
  }
  if(!confettiRAF) animateConfetti();
}
let confettiRAF=null;
function animateConfetti(){
  cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  confettiPieces.forEach(p=>{
    p.vy+=p.g*0.15; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life--;
    cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot*Math.PI/180);
    cctx.fillStyle=p.color; cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size); cctx.restore();
  });
  confettiPieces=confettiPieces.filter(p=>p.life>0 && p.y<confettiCanvas.height+40);
  if(confettiPieces.length>0){ confettiRAF=requestAnimationFrame(animateConfetti); }
  else { confettiRAF=null; cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); }
}

/* ================= CUSTOM MEDIA (IndexedDB) ================= */
/* Lets a teacher replace the default pictogram for any scenario with their
   own photo or short video. Stored locally on this device only. */
let mediaDB=null;
let customMediaCache={}; // scenarioId -> {type:'image'|'video', url, thumb}

/* ---- Bundled "example" videos shipped with the repo (optional) ----
   If a file named media/<scenarioId>.mp4 exists next to this HTML file
   (e.g. media/pen_drop.mp4), every visitor sees it automatically with
   zero setup — this is the "standard" experience. A teacher's own
   uploaded video (above) always takes priority over this on their device.
   If the file doesn't exist, this fails silently and falls back to the
   default pictogram — nothing breaks if you don't add any videos. */
let bundledMediaCache={}; // scenarioId -> {url, thumb}
function bundledVideoUrl(id){ return 'media/'+id+'.mp4'; }
function captureThumbFromVideoSrc(url){
  return new Promise((resolve)=>{
    let settled=false;
    const done=(val)=>{ if(settled) return; settled=true; resolve(val); };
    const canvas=document.createElement('canvas'); canvas.width=200; canvas.height=200;
    const cx=canvas.getContext('2d');
    const vid=document.createElement('video');
    vid.muted=true; vid.playsInline=true; vid.src=url;
    vid.onloadeddata=()=>{ try{ vid.currentTime=Math.min(0.3,(vid.duration||1)/2); }catch(e){ done(null); } };
    vid.onseeked=()=>{
      try{
        const scale=Math.max(200/vid.videoWidth,200/vid.videoHeight);
        const w=vid.videoWidth*scale,h=vid.videoHeight*scale;
        cx.drawImage(vid,(200-w)/2,(200-h)/2,w,h);
        done(canvas.toDataURL('image/jpeg',0.8));
      }catch(e){ done(null); }
    };
    vid.onerror=()=>done(null);
    setTimeout(()=>done(null),4000);
  });
}
async function probeBundledMedia(){
  await Promise.all(SCENARIOS.map(async sc=>{
    if(customMediaCache[sc.id]) return; // a teacher's own upload always wins, skip probing
    const url=bundledVideoUrl(sc.id);
    const thumb=await captureThumbFromVideoSrc(url);
    if(thumb){ bundledMediaCache[sc.id]={url,thumb}; }
  }));
}
/* Single place every part of the game asks "what should this scenario show?" —
   teacher's own upload first, then the shared example video, then nothing
   (falls back to the default pictogram icon). */
function getScenarioMedia(id){
  if(customMediaCache[id]) return {type:customMediaCache[id].type,url:customMediaCache[id].url,thumb:customMediaCache[id].thumb,source:'custom'};
  if(bundledMediaCache[id]) return {type:'video',url:bundledMediaCache[id].url,thumb:bundledMediaCache[id].thumb,source:'bundled'};
  return null;
}
function openMediaDB(){
  return new Promise((resolve)=>{
    if(mediaDB){ resolve(mediaDB); return; }
    try{
      const req=indexedDB.open('whdet_media_db',1);
      req.onupgradeneeded=(e)=>{ e.target.result.createObjectStore('media',{keyPath:'id'}); };
      req.onsuccess=(e)=>{ mediaDB=e.target.result; resolve(mediaDB); };
      req.onerror=()=>resolve(null);
    }catch(e){ resolve(null); }
  });
}
function idbGet(id){
  return openMediaDB().then(db=>new Promise(res=>{
    if(!db){ res(null); return; }
    try{
      const tx=db.transaction('media','readonly').objectStore('media').get(id);
      tx.onsuccess=()=>res(tx.result||null); tx.onerror=()=>res(null);
    }catch(e){ res(null); }
  }));
}
function idbPut(record){
  return openMediaDB().then(db=>new Promise(res=>{
    if(!db){ res(false); return; }
    try{
      const tx=db.transaction('media','readwrite').objectStore('media').put(record);
      tx.onsuccess=()=>res(true); tx.onerror=()=>res(false);
    }catch(e){ res(false); }
  }));
}
function idbDelete(id){
  return openMediaDB().then(db=>new Promise(res=>{
    if(!db){ res(false); return; }
    try{
      const tx=db.transaction('media','readwrite').objectStore('media').delete(id);
      tx.onsuccess=()=>res(true); tx.onerror=()=>res(false);
    }catch(e){ res(false); }
  }));
}
function idbGetAll(){
  return openMediaDB().then(db=>new Promise(res=>{
    if(!db){ res([]); return; }
    try{
      const tx=db.transaction('media','readonly').objectStore('media').getAll();
      tx.onsuccess=()=>res(tx.result||[]); tx.onerror=()=>res([]);
    }catch(e){ res([]); }
  }));
}
function makeThumbnail(file){
  return new Promise((resolve)=>{
    let settled=false;
    const done=(val,errMsg)=>{ if(settled) return; settled=true; resolve({thumb:val,error:errMsg||null}); };
    const canvas=document.createElement('canvas'); canvas.width=200; canvas.height=200;
    const cx=canvas.getContext('2d');
    const vid=document.createElement('video');
    vid.muted=true; vid.playsInline=true; vid.src=URL.createObjectURL(file);
    vid.onloadeddata=()=>{ try{ vid.currentTime=Math.min(0.3, (vid.duration||1)/2); }catch(e){ done(null,'Could not seek into video.'); } };
    vid.onseeked=()=>{
      try{
        const scale=Math.max(200/vid.videoWidth,200/vid.videoHeight);
        const w=vid.videoWidth*scale,h=vid.videoHeight*scale;
        cx.drawImage(vid,(200-w)/2,(200-h)/2,w,h);
        done(canvas.toDataURL('image/jpeg',0.8));
      }catch(e){ done(null,'Could not draw video frame.'); }
    };
    vid.onerror=()=>done(null,describeVideoError(vid));
    setTimeout(()=>done(null,'Timed out reading the video — it may be corrupted or in an unsupported format.'),5000);
  });
}
async function saveScenarioMedia(scenarioId,file){
  const result=await makeThumbnail(file);
  const type='video';
  const ok=await idbPut({id:scenarioId,type,mime:file.type,blob:file,thumb:result.thumb,error:result.error});
  if(ok){
    if(customMediaCache[scenarioId] && customMediaCache[scenarioId].url) URL.revokeObjectURL(customMediaCache[scenarioId].url);
    customMediaCache[scenarioId]={type,url:URL.createObjectURL(file),thumb:result.thumb,error:result.error};
  }
  return ok;
}
async function setScenarioThumbnail(scenarioId,thumbDataUrl){
  const rec=await idbGet(scenarioId);
  if(!rec) return false;
  rec.thumb=thumbDataUrl; rec.error=null;
  const ok=await idbPut(rec);
  if(ok && customMediaCache[scenarioId]){
    customMediaCache[scenarioId].thumb=thumbDataUrl;
    customMediaCache[scenarioId].error=null;
  }
  return ok;
}
async function removeScenarioMedia(scenarioId){
  await idbDelete(scenarioId);
  if(customMediaCache[scenarioId] && customMediaCache[scenarioId].url) URL.revokeObjectURL(customMediaCache[scenarioId].url);
  delete customMediaCache[scenarioId];
}
async function preloadAllCustomMedia(){
  const all=await idbGetAll();
  all.forEach(rec=>{
    try{ customMediaCache[rec.id]={type:rec.type,url:URL.createObjectURL(rec.blob),thumb:rec.thumb,error:rec.error}; }catch(e){}
  });
}

function computeTokens(q){
  let text=(q||'').trim();
  let trailing='';
  const m=text.match(/([?.!]+)$/);
  if(m){ trailing=m[1]; text=text.slice(0,text.length-trailing.length).trim(); }
  const words=text.split(/\s+/).filter(Boolean);
  return trailing? [...words,trailing] : words;
}
function getContent(sc){
  const o=OVERRIDES[sc.id]||{};
  const question=o.question && o.question.trim() ? o.question.trim() : sc.question;
  const answer=o.answer && o.answer.trim() ? o.answer.trim() : sc.answer;
  const hasCustomText=!!(o.label || o.question || o.answer || o.reveal || o.prompt);
  // Once any field is customized, don't fall back to the original built-in
  // feedback/prompt sentences — they almost certainly won't match the new content.
  const reveal = o.reveal && o.reveal.trim() ? o.reveal.trim()
    : (hasCustomText ? '' : sc.reveal);
  const prompt = o.prompt && o.prompt.trim() ? o.prompt.trim()
    : (hasCustomText ? 'Something happened! Ask a question.' : sc.prompt);
  return {
    label: o.label && o.label.trim() ? o.label.trim() : sc.answer,
    question,
    answer,
    reveal,
    prompt,
    tokens: (o.question && o.question.trim()) ? computeTokens(question) : sc.tokens
  };
}

      topLine.appendChild(previewBtn);
    }

    const previewSlot=document.createElement('div'); previewSlot.className='previewSlot'; previewSlot.id='preview-'+sc.id;

    const fieldWrap=document.createElement('div'); fieldWrap.className='mediaFields';
    const pField=makeMediaField('Intro', content.prompt, 'Optional — the line shown before the question, e.g. "Something happened!"', (val)=>{
      OVERRIDES[sc.id]=OVERRIDES[sc.id]||{}; OVERRIDES[sc.id].prompt=val; saveOverrides();
    });
    const nameField=makeMediaField('Name', content.label, sc.answer, (val)=>{
      OVERRIDES[sc.id]=OVERRIDES[sc.id]||{}; OVERRIDES[sc.id].label=val; saveOverrides();
    });
    const qField=makeMediaField('Question', content.question, sc.question, (val)=>{
      OVERRIDES[sc.id]=OVERRIDES[sc.id]||{}; OVERRIDES[sc.id].question=val; saveOverrides();
    });
    const aField=makeMediaField('Answer', content.answer, sc.answer, (val)=>{
      OVERRIDES[sc.id]=OVERRIDES[sc.id]||{}; OVERRIDES[sc.id].answer=val; saveOverrides();
    });
    const rField=makeMediaField('Feedback', content.reveal, 'Optional — a longer sentence spoken after a correct answer', (val)=>{
      OVERRIDES[sc.id]=OVERRIDES[sc.id]||{}; OVERRIDES[sc.id].reveal=val; saveOverrides();
    });
    fieldWrap.appendChild(pField); fieldWrap.appendChild(nameField); fieldWrap.appendChild(qField); fieldWrap.appendChild(aField); fieldWrap.appendChild(rField);

    const actions=document.createElement('div'); actions.className='mediaActions';
    const uploadWrap=document.createElement('div'); uploadWrap.className='fileBtn';
    const uploadBtn=document.createElement('button'); uploadBtn.className='miniBtn';
    uploadBtn.textContent = custom ? 'Replace Your Video' : (bundled ? 'Upload Your Own (override example)' : 'Upload Video');
    const fileInput=document.createElement('input'); fileInput.type='file'; fileInput.accept='video/*'; fileInput.capture='environment';
    fileInput.onchange=async (e)=>{
      const file=e.target.files[0]; if(!file) return;
      if(!file.type.startsWith('video')){ alert('Please choose a video file.'); return; }
      uploadBtn.textContent='Saving…';
      await saveScenarioMedia(sc.id,file);
      renderMediaManager();
    };
    uploadWrap.appendChild(uploadBtn); uploadWrap.appendChild(fileInput);
    actions.appendChild(uploadWrap);
    if(custom){
      const resetVidBtn=document.createElement('button'); resetVidBtn.className='miniBtn';
      resetVidBtn.textContent = bundled ? 'Remove — revert to example' : 'Remove Video';
      resetVidBtn.onclick=async ()=>{ await removeScenarioMedia(sc.id); renderMediaManager(); };
      actions.appendChild(resetVidBtn);
    }
    if(hasTextOverride){
      const resetTextBtn=document.createElement('button'); resetTextBtn.className='miniBtn'; resetTextBtn.textContent='Reset Text';
      resetTextBtn.onclick=()=>{ delete OVERRIDES[sc.id]; saveOverrides(); renderMediaManager(); };
      actions.appendChild(resetTextBtn);
    }

    card.appendChild(topLine); card.appendChild(previewSlot); card.appendChild(fieldWrap); card.appendChild(actions);
    manager.appendChild(card);
  });
}
function describeVideoError(vid){
  const codeMap={1:'Loading was aborted.',2:'A network error occurred while loading.',
    3:'The browser could not decode this video (unsupported codec inside the file).',
    4:'This video format/codec is not supported by this browser.'};
  const err=vid && vid.error;
  const codeMsg=err && codeMap[err.code] ? codeMap[err.code] : 'Unknown playback error.';
  return codeMsg + (err?` (code ${err.code})`:'');
}
function togglePreview(scenarioId,btn,card){
  const slot=card.querySelector('#preview-'+scenarioId);
  if(slot.dataset.open==='1'){
    slot.innerHTML=''; slot.dataset.open='0'; btn.textContent='▶ Preview';
    return;
  }
  const isCustom=!!customMediaCache[scenarioId];
  const display=getScenarioMedia(scenarioId);
  if(!display){ return; }
  const frameBtnHtml = isCustom
    ? `<div style="display:flex;justify-content:center;margin-top:6px;"><button class="miniBtn" id="setframe-${scenarioId}">📸 Use This Frame as Picture</button></div>`
    : '';
  slot.innerHTML=`<video src="${display.url}" controls playsinline style="width:100%;max-height:180px;border-radius:14px;background:#111;"></video>
    ${frameBtnHtml}
    <div class="mediaWarning" id="preview-err-${scenarioId}" style="display:none;"></div>`;
  const vid=slot.querySelector('video');
  const errBox=slot.querySelector('#preview-err-'+scenarioId);
  const setFrameBtn=slot.querySelector('#setframe-'+scenarioId);
  vid.onerror=()=>{
    errBox.style.display='block';
    errBox.textContent='⚠️ '+describeVideoError(vid)+' Most likely cause: this is an iPhone video saved with HEVC/H.265 encoding — even inside an .mp4 file, that codec isn\'t supported by every browser. Try re-exporting/re-saving as "Most Compatible" (H.264) and re-uploading.';
  };
  if(setFrameBtn){
    setFrameBtn.onclick=async ()=>{
      setFrameBtn.textContent='Saving…';
      try{
        const canvas=document.createElement('canvas'); canvas.width=200; canvas.height=200;
        const cx=canvas.getContext('2d');
        const scale=Math.max(200/vid.videoWidth,200/vid.videoHeight);
        const w=vid.videoWidth*scale,h=vid.videoHeight*scale;
        cx.drawImage(vid,(200-w)/2,(200-h)/2,w,h);
        const newThumb=canvas.toDataURL('image/jpeg',0.8);
        await setScenarioThumbnail(scenarioId,newThumb);
        setFrameBtn.textContent='✓ Picture Updated';
        setTimeout(()=>renderMediaManager(),700);
      }catch(e){ setFrameBtn.textContent='Could not capture — try pausing the video first'; }
    };
  }
  slot.dataset.open='1'; btn.textContent='✕ Close Preview';
}
function makeMediaField(labelText,currentVal,placeholderVal,onSave){
  const wrap=document.createElement('label'); wrap.className='mediaField';
  const lab=document.createElement('span'); lab.className='mediaFieldLabel'; lab.textContent=labelText;
  const input=document.createElement('input'); input.type='text';
  input.value=currentVal; input.placeholder=placeholderVal;
  input.className='mediaFieldInput';
  input.onchange=(e)=>{ onSave(e.target.value); renderMediaManager(); };
  wrap.appendChild(lab); wrap.appendChild(input);
  return wrap;
}
document.getElementById('settingsSaveBtn').addEventListener('click',()=>{
  saveSettings(); goBack();
});

/* ================= GAME STATE ================= */
let roundQueue=[]; let currentIndex=0; let currentScenario=null;
let wrongAttempts=0; let sessionCorrect=0; let sessionTotal=0;
let awaitingBuild=false; let buildTokens=[]; let buildAnswer=[]; let buildSlots=[];
let sceneSwapTimer=null;

document.getElementById('startPlayBtn').addEventListener('click',()=>{ unlockAudioAndSpeech(); startSession(); });
document.getElementById('nextRoundBtn').addEventListener('click',nextRound);
document.getElementById('playAgainBtn').addEventListener('click',()=>{ startSession(); });

function activeWHTypes(){
  return ['what'];
}
function buildRoundQueue(){
  const whTypes=activeWHTypes();
  let pool=SCENARIOS.filter(s=>whTypes.includes(s.wh));
  if(pool.length===0) pool=SCENARIOS.filter(s=>s.wh==='what');
  let queue=[];
  while(queue.length<SETTINGS.rounds){
    const shuffled=[...pool].sort(()=>Math.random()-0.5);
    queue=queue.concat(shuffled);
  }
  return queue.slice(0,SETTINGS.rounds);
}
function startSession(){
  roundQueue=buildRoundQueue(); currentIndex=0; sessionCorrect=0; sessionTotal=0;
  showScreen('screen-game'); loadRound();
}
function stopGame(){ try{ window.speechSynthesis.cancel(); }catch(e){} }

function enterFullscreen(vid){
  try{
    if(vid.webkitEnterFullscreen){ vid.webkitEnterFullscreen(); return; } // iOS Safari native video fullscreen
    if(vid.requestFullscreen){ vid.requestFullscreen(); return; }
    if(vid.webkitRequestFullscreen){ vid.webkitRequestFullscreen(); return; }
    if(vid.msRequestFullscreen){ vid.msRequestFullscreen(); return; }
  }catch(e){}
}
function renderStageMedia(scenario){
  const stageEl=document.getElementById('gameEmoji');
  clearTimeout(sceneSwapTimer);
  const display=getScenarioMedia(scenario.id);
  stageEl.className='sceneEmoji anim-fade';
  if(display && display.type==='video'){
    stageEl.innerHTML=`<div class="videoWrap">
        <video playsinline webkit-playsinline muted></video>
        <button class="fsBtn" title="Full screen" aria-label="Play full screen">⛶</button>
      </div>`;
    const wrap=stageEl.querySelector('.videoWrap');
    const vid=wrap.querySelector('video');
    const fsBtn=wrap.querySelector('.fsBtn');
    vid.src=display.url;
    fsBtn.onclick=(e)=>{ e.stopPropagation(); enterFullscreen(vid); };
    let failed=false;
    const showFallback=()=>{
      if(failed) return; failed=true;
      const diag=describeVideoError(vid);
      renderDefaultIcon(scenario);
      const note=document.createElement('div'); note.className='videoErrorNote';
      note.textContent="Video couldn't play: "+diag;
      stageEl.appendChild(note);
    };
    vid.onerror=showFallback;
    vid.onloadeddata=()=>{
      const playPromise=vid.play();
      if(playPromise && playPromise.catch){
        playPromise.catch(()=>{
          // Autoplay blocked — let the student/teacher tap to start it.
          const tap=document.createElement('div'); tap.className='tapToPlay';
          tap.innerHTML='<div class="playIcon">▶️</div>';
          tap.onclick=()=>{ vid.play(); tap.remove(); };
          wrap.appendChild(tap);
        });
      }
    };
    // If nothing loads within 4s, treat as failed rather than leaving a blank box.
    setTimeout(()=>{ if(vid.readyState===0) showFallback(); },4000);
    return;
  }
  renderDefaultIcon(scenario);
}
function renderDefaultIcon(scenario){
  const stageEl=document.getElementById('gameEmoji');
  clearTimeout(sceneSwapTimer);
  stageEl.className='sceneEmoji anim-'+scenario.anim;
  stageEl.innerHTML=iconMarkup(scenario.beforeIcon);
  void stageEl.offsetWidth; // restart animation
  sceneSwapTimer=setTimeout(()=>{
    stageEl.innerHTML=iconMarkup(scenario.afterIcon);
    stageEl.className='sceneEmoji anim-fade';
  }, 1000);
}
function choiceIconHTML(scenario){
  const display=getScenarioMedia(scenario.id);
  if(display && display.thumb){ return `<div class="choiceIcon"><img src="${display.thumb}"></div>`; }
  return `<div class="choiceIcon">${iconMarkup(scenario.answerIcon)}</div>`;
}

function loadRound(){
  if(currentIndex>=roundQueue.length){ endSession(); return; }
  const base=roundQueue[currentIndex];
  currentScenario=Object.assign({},base,getContent(base));
  wrongAttempts=0; awaitingBuild=false;
  document.getElementById('progressFill').style.width=Math.round((currentIndex/roundQueue.length)*100)+'%';
  document.getElementById('revealPanel').style.display='none';
  document.getElementById('tokenTray').style.display='none';
  document.getElementById('sentenceStrip').style.display='none';
  document.getElementById('choiceGrid').innerHTML='';

  renderStageMedia(currentScenario);

  if(SETTINGS.mode==='answer'){
    startAnswerStep();
  } else {
    startAskStep();
  }
}

/* ---- STEP 1: choose the WH-word ('ask' and 'both' modes) ---- */
function startAskStep(){
  document.getElementById('speechBubble').textContent=currentScenario.prompt;
  setTimeout(()=>{ playSound(currentScenario.sound); speak(currentScenario.prompt); },250);
  renderWHChoices();
}
function renderWHChoices(){
  const grid=document.getElementById('choiceGrid');
  grid.innerHTML='';
  const correct=currentScenario.wh;
  const allWH=['what','who','where','why','when'];
  let distractorCount = SETTINGS.support==='guided'?1 : SETTINGS.support==='practice'?2 : 4;
  let distractors=allWH.filter(w=>w!==correct).sort(()=>Math.random()-0.5).slice(0,distractorCount);
  let choices=[correct,...distractors].sort(()=>Math.random()-0.5);

  choices.forEach(w=>{
    const btn=document.createElement('button');
    btn.className='whChoice '+WH_COLORS[w];
    btn.innerHTML=`<span style="font-size:1.3em;">${WH_ICONS[w]}</span><span>${WH_LABELS[w]}</span>`;
    if(SETTINGS.support==='guided' && w===correct){ btn.classList.add('correctGlow'); }
    btn.onclick=()=>handleWHChoice(w);
    grid.appendChild(btn);
  });
}
function handleWHChoice(chosen){
  sessionTotal++;
  if(chosen===currentScenario.wh){
    playSound('success');
    sessionCorrect++;
    document.getElementById('choiceGrid').innerHTML='';
    if(SETTINGS.mode==='both'){ startAnswerStep(); }
    else if(SETTINGS.buildQuestion){ startBuildQuestion(); }
    else { showReveal(); }
  } else {
    wrongAttempts++;
    playSound('gentle');
    if(SETTINGS.support!=='guided' && wrongAttempts>=2){ hintWHChoice(); }
  }
}
function hintWHChoice(){
  document.querySelectorAll('.whChoice').forEach(b=>{
    if(b.textContent.includes(WH_LABELS[currentScenario.wh])) b.classList.add('correctGlow');
  });
}

/* ---- STEP 2: the question is read aloud, student picks the correct answer ('answer' and 'both' modes) ---- */
function startAnswerStep(){
  const q=currentScenario.question;
  document.getElementById('speechBubble').innerHTML = SETTINGS.mode==='both'
    ? `Now answer: <br><b>${q}</b>` : `<b>${q}</b>`;
  setTimeout(()=>{
    if(SETTINGS.mode==='answer'){ playSound(currentScenario.sound); }
    speak(q);
  },250);
  renderAnswerChoices();
}
function renderAnswerChoices(){
  const grid=document.getElementById('choiceGrid');
  grid.innerHTML='';
  const sameType=SCENARIOS.filter(s=>s.wh===currentScenario.wh && s.id!==currentScenario.id);
  let distractorCount = SETTINGS.support==='guided'?1 : SETTINGS.support==='practice'?2 : 4;
  distractorCount=Math.min(distractorCount, sameType.length);
  const distractors=sameType.sort(()=>Math.random()-0.5).slice(0,distractorCount);
  const choices=[{answer:currentScenario.answer,iconHtml:choiceIconHTML(currentScenario),correct:true},
    ...distractors.map(s=>({answer:getContent(s).answer,iconHtml:choiceIconHTML(s),correct:false}))]
    .sort(()=>Math.random()-0.5);

  choices.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='whChoice '+WH_COLORS[currentScenario.wh];
    if(c.answer.length>28) btn.classList.add('longText');
    btn.innerHTML=c.iconHtml+`<div>${c.answer}</div>`;
    if(SETTINGS.support==='guided' && c.correct){ btn.classList.add('correctGlow'); }
    btn.onclick=()=>handleAnswerChoice(c.correct);
    grid.appendChild(btn);
  });
}
function handleAnswerChoice(isCorrect){
  sessionTotal++;
  if(isCorrect){
    playSound('success');
    sessionCorrect++;
    document.getElementById('choiceGrid').innerHTML='';
    if(SETTINGS.mode==='both' && SETTINGS.buildQuestion){ startBuildQuestion(); }
    else { showReveal(); }
  } else {
    wrongAttempts++;
    playSound('gentle');
    if(SETTINGS.support!=='guided' && wrongAttempts>=2){ hintAnswerChoice(); }
  }
}
function hintAnswerChoice(){
  document.querySelectorAll('.whChoice').forEach(b=>{
    if(b.innerHTML.includes(currentScenario.answer)) b.classList.add('correctGlow');
  });
}

function startBuildQuestion(){
  awaitingBuild=true;
  buildAnswer=currentScenario.tokens.slice();
  buildTokens=[...buildAnswer].sort(()=>Math.random()-0.5);
  buildSlots=[];
  const tray=document.getElementById('tokenTray');
  const strip=document.getElementById('sentenceStrip');
  tray.style.display='flex'; strip.style.display='flex';
  tray.innerHTML=''; strip.innerHTML='';
  document.getElementById('speechBubble').textContent='Build the question in order!';
  buildTokens.forEach((tok,i)=>{
    const t=document.createElement('div'); t.className='token'; t.textContent=tok; t.dataset.idx=i;
    t.onclick=()=>{
      if(t.classList.contains('used')) return;
      buildSlots.push(tok); t.classList.add('used');
      renderStrip();
      if(buildSlots.length===buildAnswer.length){ checkBuild(); }
    };
    tray.appendChild(t);
  });
  renderStrip();
}
function renderStrip(){
  const strip=document.getElementById('sentenceStrip');
  strip.innerHTML = buildSlots.length ? buildSlots.join(' ') : '&nbsp;';
}
function checkBuild(){
  const correct = buildSlots.join(' ').toLowerCase() === buildAnswer.join(' ').toLowerCase();
  if(correct){ playSound('tada'); showReveal(); }
  else {
    playSound('gentle');
    setTimeout(()=>{ startBuildQuestion(); },900);
  }
}

function showReveal(){
  document.getElementById('tokenTray').style.display='none';
  document.getElementById('sentenceStrip').style.display='none';
  document.getElementById('speechBubble').textContent=currentScenario.question;
  const speechParts=["That's right! "+currentScenario.answer+'.'];
  if(currentScenario.reveal) speechParts.push(currentScenario.reveal);
  speak(speechParts.join(' '));
  const panel=document.getElementById('revealPanel');
  const revealEl=document.getElementById('revealEmoji');
  const display=getScenarioMedia(currentScenario.id);
  if(display && display.type==='image'){ revealEl.innerHTML=`<img src="${display.url}" style="max-width:160px;max-height:160px;border-radius:16px;object-fit:contain;">`; }
  else if(display && display.type==='video'){ revealEl.innerHTML=`<img src="${display.thumb}" style="max-width:160px;max-height:160px;border-radius:16px;object-fit:contain;">`; }
  else { revealEl.innerHTML=`<div style="width:80px;height:80px;margin:0 auto;">${iconMarkup(currentScenario.revealIcon)}</div>`; }
  document.getElementById('revealAnswer').textContent=currentScenario.answer;
  const revealTextEl=document.getElementById('revealText');
  revealTextEl.textContent=currentScenario.reveal;
  revealTextEl.style.display=currentScenario.reveal ? '' : 'none';
  panel.style.display='block';
  burstConfetti();
}
function nextRound(){ currentIndex++; loadRound(); }

function endSession(){
  document.getElementById('progressFill').style.width='100%';
  const pct = sessionTotal? Math.round((sessionCorrect/sessionTotal)*100):100;
  const stars = pct>=90?'⭐⭐⭐':pct>=60?'⭐⭐':'⭐';
  document.getElementById('starRow').textContent=stars;
  const name=SETTINGS.studentName? SETTINGS.studentName+', ':'';
  document.getElementById('summaryText').textContent=`${name}you played ${roundQueue.length} rounds today. Keep asking great questions!`;
  showScreen('screen-summary');
  burstConfetti();
  playSound('fanfare');
}

styleEl.textContent=`

@keyframes sceneFall{0%{transform:translateY(-80px) rotate(0deg); opacity:0;}60%{opacity:1;}100%{transform:translateY(0) rotate(15deg);}}

@keyframes sceneWalkOut{0%{transform:translateX(0); opacity:1;}100%{transform:translateX(140px); opacity:0.15;}}

@keyframes sceneRain{0%{transform:translateY(-30px); opacity:0.3;}100%{transform:translateY(0); opacity:1;}}

document.head.appendChild(styleEl);
</script>
