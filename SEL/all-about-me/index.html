<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All About Me</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="top">
    <div class="top-inner">
      <h1><span class="heart" aria-hidden="true">💗</span> All About Me</h1>
      <label class="switch" title="Say each word out loud when it is tapped">
        <input type="checkbox" id="speakToggle" checked>
        <span class="track" aria-hidden="true"></span>
        <span class="switch-text">🔊 Say the words</span>
      </label>
    </div>
  </header>

  <main class="layout">

    <!-- LEFT: picture + basic details -->
    <aside class="me card" aria-label="About me">
      <div class="photo-wrap"><div class="photo-frame" id="photoFrame">
        <button type="button" class="photo-remove" id="removePhoto" aria-label="Remove my picture" title="Remove picture" hidden>×</button>
        <img id="photoImg" alt="My picture" hidden>
        <svg id="photoPlaceholder" viewBox="0 0 200 200" role="img" aria-label="No picture yet">
          <circle cx="100" cy="78" r="38" fill="currentColor" opacity=".35"/>
          <path d="M28 190c6-44 38-66 72-66s66 22 72 66z" fill="currentColor" opacity=".35"/>
        </svg>
      </div></div>
      <div class="photo-actions">
        <button type="button" class="btn soft" id="takePhoto">📷 Take photo</button>
        <button type="button" class="btn soft" id="uploadPhoto">🖼️ Upload</button>
      </div>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <input type="file" id="cameraInput" accept="image/*" capture="user" hidden>

      <div class="fields">
        <label>My name
          <input type="text" id="fName" maxlength="40" placeholder="Type your name" autocomplete="off">
        </label>
        <label>My age
          <input type="number" id="fAge" min="1" max="120" inputmode="numeric" placeholder="Age">
        </label>
        <label>My school
          <input type="text" id="fSchool" maxlength="60" placeholder="Where you study" autocomplete="off">
        </label>
      </div>
    </aside>

    <!-- RIGHT: AAC board -->
    <section class="board card" aria-label="Choose words about me">
      <div class="board-head">
        <button type="button" class="btn back" id="backBtn" hidden>← Back</button>
        <nav id="crumbs" class="crumbs" aria-label="Where am I"></nav>
      </div>
      <h2 id="boardTitle" class="board-title"></h2>
      <div id="grid" class="grid"></div>
    </section>

  </main>

  <!-- Bottom: my list -->
  <footer class="tray" id="tray">
    <div class="tray-inner">
      <div class="tray-main">
        <div class="tray-title"><span>My list</span> <span class="count" id="trayCount">0</span></div>
        <div class="chips" id="chips" aria-live="polite"></div>
      </div>
      <div class="tray-actions">
        <button type="button" class="link-btn" id="startOver">Start again</button>
        <button type="button" class="btn primary" id="makeProfile">✨ Make my Profile</button>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Camera -->
  <dialog id="cameraDialog" aria-label="Take a photo">
    <div class="dlg">
      <video id="video" autoplay playsinline muted></video>
      <div class="dlg-actions center">
        <button type="button" class="btn soft" id="camCancel">Cancel</button>
        <button type="button" class="shutter" id="camShoot" aria-label="Take the picture"></button>
      </div>
    </div>
  </dialog>

  <!-- Type your own word -->
  <dialog id="typeDialog" aria-labelledby="typeTitle">
    <form class="dlg" id="typeForm" method="dialog" novalidate>
      <h2 id="typeTitle"></h2>
      <input type="text" id="typeInput" maxlength="40" autocomplete="off">
      <div class="added" id="typeAdded" aria-live="polite"></div>
      <div class="dlg-actions">
        <button type="button" class="btn soft" id="typeDone">Done</button>
        <button type="submit" class="btn primary" id="typeAdd">Add</button>
      </div>
    </form>
  </dialog>

  <!-- Profile -->
  <dialog id="profileDialog" aria-label="My profile">
    <div class="dlg profile">
      <div class="profile-card" id="profileCard">
        <div class="profile-photo" id="profilePhoto"></div>
        <h2 id="profileName"></h2>
        <p class="profile-text" id="profileText"></p>
      </div>
      <div class="dlg-actions wrap no-print">
        <button type="button" class="btn primary" id="readBtn">🔊 Read to me</button>
        <button type="button" class="btn soft" id="copyBtn">📋 Copy</button>
        <button type="button" class="btn soft" id="printBtn">🖨️ Print</button>
        <button type="button" class="btn soft" id="closeProfile">← Keep editing</button>
      </div>
    </div>
  </dialog>

  <script src="data.js"></script>
  <script src="profile.js"></script>
  <script src="app.js"></script>
</body>
</html>
