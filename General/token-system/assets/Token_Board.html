<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Token Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: a quiet teacher-facing shell. Landing = grid of five system tiles.
     Each system = a stage showing the learner-facing board (capped to ~60% of screen height),
     then a progress bar, then the settings panel underneath. */
  :root {
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    --bg: #f5f7fa;
    --surface: #ffffff;
    --line: #dde3ec;
    --fg: #16202e;
    --muted: #5a6678;
    --accent: #2557d6;
    --accent-fg: #ffffff;
    --accent-soft: #e7eeff;
    --ok: #1a7f46;
    --ok-soft: #e3f5ea;
    --shadow: 0 1px 2px rgba(22, 32, 46, .06), 0 4px 16px rgba(22, 32, 46, .05);

    /* Learner-facing boards look like printed cards and read the same in both themes */
    --card-bg: #fff1cf;
    --card-ink: #111111;
    --box-bg: #ffffff;
    --win: #f5b400;
    --chart-bg: #e2efd9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141b; --surface: #171e28; --line: #283140; --fg: #e8edf5; --muted: #9aa6b8;
      --accent: #7aa2ff; --accent-fg: #0b1220; --accent-soft: #1b2a4a;
      --ok: #5fd08d; --ok-soft: #14301f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 16px rgba(0, 0, 0, .25);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141b; --surface: #171e28; --line: #283140; --fg: #e8edf5; --muted: #9aa6b8;
    --accent: #7aa2ff; --accent-fg: #0b1220; --accent-soft: #1b2a4a;
    --ok: #5fd08d; --ok-soft: #14301f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    padding-block: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1200px; margin: 0 auto; padding-block: 20px 56px; }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; text-decoration: none; color: var(--fg); }
  .brand svg { width: 28px; height: 28px; }
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: 14px; padding: 6px 10px; border-radius: 8px; }
  .back:hover { background: var(--accent-soft); color: var(--accent); }

  /* Landing */
  .hero { padding: 16px 0 28px; max-width: 640px; }
  h1 { font-size: clamp(26px, 4vw, 34px); line-height: 1.15; letter-spacing: -.02em; margin: 0 0 8px; font-weight: 700; text-wrap: balance; }
  .lede { color: var(--muted); margin: 0; font-size: 16px; max-width: 56ch; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .tile {
    display: flex; flex-direction: column; gap: 14px; text-align: left;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; box-shadow: var(--shadow); min-width: 0; text-decoration: none; color: inherit;
  }
  a.tile:hover { border-color: var(--accent); }
  .tile[aria-disabled="true"] { opacity: .72; box-shadow: none; }
  .preview { background: var(--bg); border-radius: 10px; padding: 12px; color: var(--muted); display: grid; place-items: center; height: 108px; }
  .preview svg { width: 100%; max-width: 190px; height: 100%; }
  .tile h2 { font-size: 16px; margin: 0; letter-spacing: -.01em; }
  .tile p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .tile-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; gap: 8px; }
  .chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .chip.soon { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .open { font-size: 14px; font-weight: 600; color: var(--accent); }

  /* Workspace */
  .work { display: flex; flex-direction: column; gap: 16px; }
  .main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .caption h1 { font-size: 22px; margin: 0; }

  /* The stage holds a board no taller than --h; the board's width follows its own proportions */
  .stage { --h: 60dvh; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: clamp(12px, 2.4vw, 24px); box-shadow: var(--shadow); }
  .fit { container-type: inline-size; width: min(100%, calc(var(--h) * var(--ratio, 1.7))); margin-inline: auto; }
  body.present .stage { --h: 68dvh; }

  /* Shared reward contents (picture, pictogram, words) */
  .reward img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .reward img.pict { object-fit: contain; padding: 5%; }
  .reward .words { font-weight: 600; text-align: center; line-height: 1.2; overflow-wrap: anywhere; }
  .reward .empty { color: #555; text-align: center; font-weight: 500; }

  /* "I am working for" card (measured from the reference image: 890 x 515) */
  .card {
    background: var(--card-bg);
    color: var(--card-ink);
    border: max(2px, .35cqw) solid var(--card-ink);
    padding: 7cqw 7.3cqw 5.4cqw;
    width: 100%;
  }
  .card-top { display: flex; align-items: center; justify-content: space-between; padding: 0 6.4cqw 0 6.4cqw; margin-bottom: 7.6cqw; gap: 3cqw; }
  .card-title { font-size: 5.4cqw; line-height: 1.15; font-weight: 500; letter-spacing: -.01em; margin: 0; }
  .card .reward, .pbc .reward {
    width: 23cqw; aspect-ratio: 1 / 1; flex: none;
    background: var(--box-bg); border: max(2px, .35cqw) solid var(--card-ink);
    display: grid; place-items: center; overflow: hidden; position: relative;
  }
  .card .reward .words { font-size: 3.6cqw; padding: 1.6cqw; }
  .card .reward .words.long { font-size: 2.8cqw; }
  .card .reward .empty { font-size: 2.3cqw; padding: 1.5cqw; }
  .card .reward.win, .pbc .reward.win { animation: bounce .7s ease-out 1; box-shadow: 0 0 0 .9cqw var(--win); }

  .tokens { display: flex; flex-wrap: wrap; justify-content: center; gap: 2.1cqw; --cols: 5; }
  .tok {
    width: calc((100% - (var(--cols) - 1) * 2.1cqw) / var(--cols) - .01px);
    aspect-ratio: 1 / 1; padding: 0;
    background: var(--box-bg); border: max(2px, .35cqw) solid var(--card-ink); border-radius: 0;
    display: grid; place-items: center; color: var(--card-ink);
  }
  .tok:hover { background: #fffdf6; }
  .tok svg { width: 72%; height: 72%; display: block; }
  .tok .ico, .bcheck .ico { opacity: 0; transform: scale(.5); transition: opacity .15s, transform .2s; }
  .tok[aria-pressed="true"] .ico, .bcheck[aria-pressed="true"] .ico { opacity: 1; transform: scale(1); }
  .tok .ico.pop, .bcheck .ico.pop { animation: pop .35s ease-out 1; }

  /* Numbered work system strip (reference: countdown cells, then reward) */
  .strip {
    container-type: inline-size;
    display: grid; grid-template-columns: repeat(var(--cols, 6), 1fr);
    gap: 1.5px; background: var(--card-ink); border: 3px solid var(--card-ink);
    width: 100%;
  }
  .cell {
    position: relative; background: var(--box-bg); color: var(--card-ink);
    aspect-ratio: 1 / 1.04; border: 0; padding: 0; border-radius: 0;
    display: grid; place-items: center; overflow: hidden; min-width: 0;
  }
  button.cell:hover { background: #fffdf6; }
  .cell .num { font-size: calc(100cqw / var(--cols) * .46); font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .cell .cover { position: absolute; inset: 0; background: var(--box-bg); display: grid; place-items: center; }
  .cell .cover svg { width: 74%; height: 74%; display: block; }
  .cell .cover .ico.pop { animation: pop .35s ease-out 1; }
  .rcell .words { font-size: calc(100cqw / var(--cols) * .15); padding: 4%; }
  .rcell .words.long { font-size: calc(100cqw / var(--cols) * .11); }
  .rcell .empty { font-size: calc(100cqw / var(--cols) * .13); padding: 6%; }
  .rcell.win { box-shadow: inset 0 0 0 calc(100cqw / var(--cols) * .06) var(--win); }
  .rcell.win img { padding: 8%; }

  /* Positive behaviour reward chart (reference: 880 x 600) */
  .pbc {
    background: var(--chart-bg); color: var(--card-ink);
    border: max(2px, .4cqw) solid var(--card-ink);
    padding: 0 2.5cqw .9cqw; width: 100%;
  }
  .pbc-title { font-size: 4.6cqw; line-height: 1.2; font-weight: 500; text-align: center; margin: 0; padding: 1.5cqw 0 2.1cqw; letter-spacing: -.005em; }
  .pbc-band { background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 3cqw; padding: .85cqw 13.5cqw .85cqw 8cqw; }
  .pbc-working { font-size: 5.4cqw; line-height: 1.15; font-weight: 500; margin: 0; letter-spacing: -.01em; }
  .pbc .reward { width: 23.3cqw; aspect-ratio: 205 / 200; }
  .pbc .reward .words { font-size: 3.4cqw; padding: 1.4cqw; }
  .pbc .reward .words.long { font-size: 2.6cqw; }
  .pbc .reward .empty { font-size: 2.2cqw; padding: 1.4cqw; }
  .pbc-row { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); padding: 3.2cqw 6.6cqw 0; }
  .bcol { display: grid; justify-items: center; align-content: start; gap: .7cqw; padding: 0 1.2cqw; min-width: 0; }
  .bbox {
    width: min(100%, 23.4cqw); aspect-ratio: 206 / 179; background: #fff;
    border: max(2px, .35cqw) solid var(--card-ink);
    display: grid; place-items: center; overflow: hidden;
  }
  .bbox img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bbox img.pict { object-fit: contain; padding: 4%; }
  .bbox .words { font-size: 2.8cqw; font-weight: 600; text-align: center; line-height: 1.2; padding: 1cqw; overflow-wrap: anywhere; }
  .bbox .empty { font-size: 1.9cqw; color: #555; text-align: center; font-weight: 500; padding: 1cqw; }
  .bcheck {
    width: max(7.8cqw, 28px); aspect-ratio: 1 / 1; background: #fff; padding: 0; border-radius: 0;
    border: max(1px, .12cqw) solid var(--card-ink); display: grid; place-items: center;
  }
  .bcheck:hover { background: #f7fbf2; }
  .bcheck svg { width: 82%; height: 82%; display: block; }

  /* Token art, shared */
  .ico .f { fill: var(--tok); stroke: #111; stroke-width: 1.2; stroke-linejoin: round; }
  .ico .l { fill: none; stroke: var(--tok); stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
  .ico .d { fill: #111; }
  .ico .m { fill: none; stroke: #111; stroke-width: 1.4; stroke-linecap: round; }

  @keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes bounce { 0% { transform: scale(1); } 35% { transform: scale(1.08); } 100% { transform: scale(1); } }

  /* Status + actions */
  .bar { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; box-shadow: var(--shadow); }
  .progress { flex: 1 1 200px; min-width: 0; }
  .progress-label { font-weight: 600; font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 8px; }
  .progress-label span:last-child { color: var(--muted); font-weight: 500; }
  .meter { height: 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); margin-top: 8px; overflow: hidden; }
  .meter > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.primary:hover { filter: brightness(1.08); color: var(--accent-fg); }
  .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; border-color: var(--line); color: inherit; }
  .btn.primary:disabled { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .done { background: var(--ok-soft); color: var(--ok); border-radius: 12px; padding: 12px 16px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .done .btn { color: var(--fg); }

  /* Panel (sits under the board) */
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    padding: 4px 20px 20px; display: grid; gap: 0 32px; align-items: start;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
  }
  .field { padding-top: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); margin: 0; }
  .input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px; }
  .input:focus-visible { outline-offset: 0; border-color: var(--accent); }
  .seg { display: grid; grid-template-columns: repeat(2, 1fr); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg.n { grid-template-columns: repeat(var(--n, 3), 1fr); }
  .seg button { border: 0; background: transparent; border-radius: 7px; padding: 7px 4px; font-weight: 600; font-size: 14px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.nowrap { flex-wrap: nowrap; }
  .row.between { justify-content: space-between; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .results { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .results:empty { display: none; }
  .results button { aspect-ratio: 1 / 1; padding: 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: grid; place-items: center; }
  .results button img { width: 100%; height: 100%; object-fit: contain; padding: 4px; display: block; }
  .results button:hover { border-color: var(--accent); }
  .results button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .preset { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 5px 3px 6px; display: grid; gap: 4px; justify-items: center; align-content: start; font-size: 11px; font-weight: 600; color: var(--muted); line-height: 1.15; text-align: center; min-width: 0; }
  .preset .pimg { width: 100%; aspect-ratio: 1 / 1; background: #fff; border-radius: 6px; display: grid; place-items: center; overflow: hidden; }
  .preset .pimg img { width: 100%; height: 100%; object-fit: contain; padding: 3px; display: block; }
  .preset:hover { border-color: var(--accent); }
  .preset[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .credit { font-size: 12px; }
  .credit a { color: var(--muted); }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); align-self: flex-start; }
  .stepper button { width: 38px; height: 38px; border: 0; background: transparent; font-size: 18px; font-weight: 600; }
  .stepper button:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
  .stepper button:disabled { opacity: .35; cursor: not-allowed; }
  .stepper output { min-width: 40px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .styles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .styles button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 4px 6px; display: grid; gap: 2px; justify-items: center; font-size: 12px; font-weight: 600; color: var(--muted); }
  .styles button svg { width: 26px; height: 26px; }
  .styles button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .file:focus-visible + .btn { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Group token system: students down the side, tokens across, then a tally or one more token */
  .gt-card { --u: calc(100cqw / var(--units, 9)); background: var(--card-bg); color: var(--card-ink); border: max(2px, .35cqw) solid var(--card-ink); padding: calc(var(--u) * .25); width: 100%; }
  .gt-grid { display: grid; gap: 2px; background: var(--card-ink); border: 3px solid var(--card-ink); }
  .gname { display: flex; align-items: center; gap: calc(var(--u) * .14); padding: 0 calc(var(--u) * .14); background: var(--box-bg); border: 0; border-radius: 0; color: var(--card-ink); text-align: left; min-width: 0; }
  .gname:hover { background: #fffdf6; }
  .gname.gdone, .gtally.gdone { background: #fff3c4; }
  .gav { flex: none; width: calc(var(--u) * .7); aspect-ratio: 1 / 1; border-radius: 50%; border: 2px solid var(--card-ink); background: #fff8e6; display: grid; place-items: center; overflow: hidden; font-size: calc(var(--u) * .44); line-height: 1; }
  .gav img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gn { font-size: calc(var(--u) * .27); font-weight: 600; line-height: 1.15; min-width: 0; overflow-wrap: anywhere; }
  .gn.long { font-size: calc(var(--u) * .2); }
  .gtok { aspect-ratio: 1 / 1; padding: 0; background: var(--box-bg); border: 0; border-radius: 0; color: var(--card-ink); display: grid; place-items: center; min-width: 0; }
  .gtok:hover { background: #fffdf6; }
  .gtok svg { width: 72%; height: 72%; display: block; }
  .gtok .ico { opacity: 0; transform: scale(.5); transition: opacity .15s, transform .2s; }
  .gtok[aria-pressed="true"] .ico { opacity: 1; transform: scale(1); }
  .gtok .ico.pop { animation: pop .35s ease-out 1; }
  .gtally { aspect-ratio: 1 / 1; background: var(--box-bg); display: grid; place-items: center; font-size: calc(var(--u) * .52); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--card-ink); }

  /* Finished -> next activity */
  .gt-flow { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * .3); margin-top: calc(var(--u) * .35); }
  .fbox { flex: none; width: calc(var(--u) * var(--d)); background: var(--box-bg); border: max(2px, .3cqw) solid var(--card-ink); display: flex; flex-direction: column; color: var(--card-ink); }
  .fbox.win { box-shadow: 0 0 0 calc(var(--u) * .08) var(--win); animation: bounce .7s ease-out 1; }
  .fpic { aspect-ratio: 1 / 1; display: grid; place-items: center; overflow: hidden; }
  .fpic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fpic img.pict { object-fit: contain; padding: 5%; }
  .fpic svg { width: 78%; height: 78%; display: block; }
  .fpic .empty { font-size: calc(var(--u) * var(--d) * .11); padding: 6%; color: #555; text-align: center; font-weight: 500; }
  .flabel { border-top: max(2px, .3cqw) solid var(--card-ink); background: var(--card-bg); text-align: center; font-weight: 600; font-size: calc(var(--u) * var(--d) * .14); line-height: 1.15; padding: calc(var(--u) * var(--d) * .04); min-height: calc(var(--u) * var(--d) * .3); display: grid; place-items: center; overflow-wrap: anywhere; }
  .flabel.long { font-size: calc(var(--u) * var(--d) * .1); }
  .farrow { flex: none; width: calc(var(--u) * var(--d) * .45); }

<script>

  /* ---------- uploaded pictures: one small WebP blob each, in IndexedDB ---------- */
  function idbOpen() {

        var n = plan[k][0], q = plan[k][1];

  /* ---------- ARASAAC pictogram search, wired to a form ---------- */

      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })

        });
      });
  }
  function wireSearch(els, onPick, isPicked) {
    var ctl = null, list = [];
    function render() {
      els.results.innerHTML = '';
      list.forEach(function (r) {
        var b = document.createElement('button');
        b.type = 'button'; b.title = r.word;

        clearTimeout(timer);
        if (mine !== ctl) return;

    { id: 'numbered-work-system', title: 'Numbered work system', desc: 'Numbered trials to finish in order, then a reward.', ready: true,

    { id: 'positive-behaviour-chart', title: 'Positive behaviour reward chart', desc: 'Check off behaviour expectations to earn a reward.', ready: true,

  /* ---------- stage templates, renderers and proportions ---------- */
  var IAW_STAGE = '<div class="card"><div class="card-top"><p class="card-title">I am working for</p><div class="reward" data-r="reward"></div></div>' +

  function iawRatio(S) { return 1 / (0.579 + (S.count <= 5 ? 0 : 0.175)); }

      if (STYLES[p.style]) d.style = p.style;
      d.showFlow = p.showFlow !== false;
      if (typeof p.nextText === 'string') d.nextText = p.nextText.slice(0, 30);
      for (var i = 0; i < MAXS; i++) {
        if (p.names && typeof p.names[i] === 'string') d.names[i] = p.names[i].slice(0, 16);
        var a = p.av && p.av[i];
        if (a && a.t === 'upload') d.av[i] = { t: 'upload' };
        else if (a && a.t === 'emoji' && AVS[+a.e]) d.av[i] = { t: 'emoji', e: +a.e };
        for (var c = 0; c < MAXC; c++) {
          var f = p.filled && p.filled[i] ? p.filled[i][c] : 0;
          if (p.v !== 2 && c >= 5) f = 0;          // older saves had a separate last column
          d.filled[i][c] = f === true || f === 1 ? 1 : f === 2 ? 2 : 0;
        }
      }
      var np = p.nextPic;
      if (np && np.type === 'pictogram' && isFinite(+np.id)) d.nextPic = { type: 'pictogram', id: +np.id, word: String(np.word || '').slice(0, 40) };
      else if (np && np.type === 'upload') d.nextPic = { type: 'upload' };
      else d.nextPic = null;
      return d;
    }
    var S = load(), sel = 0, justKey = '';
    S.v = 2;
    function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

    /* ----- shell ----- */
    var root = document.createElement('section');
    root.className = 'work'; root.hidden = true; root.setAttribute('aria-label', 'Group token system');
    root.innerHTML =
      '<div class="main">' +
        '<div class="exit"><button class="btn" data-r="exit" type="button">Exit full view</button></div>' +
        '<div class="caption"><h1>Group token system</h1></div>' +
        '<div class="stage"><div class="fit" data-r="fit"></div></div>' +
        '<div class="bar">' +
          '<div class="progress" aria-live="polite"><div class="progress-label"><span data-r="progText"></span><span data-r="progLeft"></span></div><div class="meter"><i data-r="meter" style="width:0%"></i></div></div>' +
          '<div class="actions">' +
            '<button class="btn" data-r="reset" type="button">Reset all</button>' +
            '<button class="btn" data-r="present" type="button">Full view</button>' +
            '<button class="btn soundToggle" data-r="sound" type="button" aria-pressed="true"></button>' +
          '</div>' +
        '</div>' +
        '<div class="done" data-r="done" hidden><span data-r="doneText"></span><button class="btn" data-r="again" type="button">Start again</button></div>' +
      '</div>' +
      '<aside class="panel" aria-label="Settings">' +
        '<div class="field"><span class="label">Number of students</span>' +
          '<div class="stepper" role="group" aria-label="Number of students"><button type="button" data-r="sMinus" aria-label="Fewer students">&minus;</button><output data-r="sOut" aria-live="polite">5</output><button type="button" data-r="sPlus" aria-label="More students">+</button></div>' +
          '<p class="hint">Between 2 and 10. Five is the standard board.</p></div>' +
        '<div class="field"><span class="label">Token columns</span>' +
          '<div class="stepper" role="group" aria-label="Number of token columns"><button type="button" data-r="cMinus" aria-label="Fewer token columns">&minus;</button><output data-r="cOut" aria-live="polite">5</output><button type="button" data-r="cPlus" aria-label="More token columns">+</button></div>' +
          '<p class="hint">Between 1 and 10. Five is the standard board.</p></div>' +
        '<div class="field"><span class="label">Tally</span>' +
          '<div class="seg" data-r="tallySeg"><button type="button" data-tally="on" aria-pressed="false">On</button><button type="button" data-tally="off" aria-pressed="false">Off</button></div>' +
          '<p class="hint" data-r="tallyHint"></p></div>' +
        '<div class="field"><span class="label">Token style</span><div class="styles" data-r="styleRow"></div></div>' +
        '<div class="field"><span class="label">Finished &rarr; next activity</span>' +
          '<div class="seg" data-r="showSeg"><button type="button" data-show="yes" aria-pressed="false">Show</button><button type="button" data-show="no" aria-pressed="false">Hide</button></div>' +
          '<div class="stack" data-r="nextStack">' +
            '<input class="input" data-r="nextIn" type="text" maxlength="30" placeholder="e.g. Snack time" autocomplete="off" aria-label="Next activity in words">' +
            '<div><div class="row"><input class="file" data-r="nextFile" id="gts-nextfile" type="file" accept="image/*"><label class="btn" for="gts-nextfile">Upload picture</label><button class="btn" type="button" data-r="nextClear">Remove</button></div>' +
            '<p class="hint" data-r="nextNote" style="margin-top:8px"></p></div>' +
            '<div class="or">or search pictograms</div>' +
            '<form class="row nowrap" data-r="nextForm" role="search"><input class="input" data-r="nextSearch" type="search" placeholder="e.g. snack, playground" autocomplete="off" aria-label="Search ARASAAC pictograms"><button class="btn" type="submit">Search</button></form>' +
            '<p class="hint" data-r="nextStatus" aria-live="polite"></p>' +
            '<div class="results" data-r="nextResults"></div>' +
            '<p class="hint credit">Pictograms by <a href="https://arasaac.org" target="_blank" rel="noopener">ARASAAC</a> (Gobierno de Aragón), licence CC BY-NC-SA.</p>' +
          '</div></div>' +
      '</aside>' +
      '<dialog class="gt-modal" data-r="modal" aria-labelledby="gts-mtitle"><div class="gt-mbody">' +
        '<div class="row between"><h2 id="gts-mtitle" data-r="mTitle">Edit student</h2><button class="btn primary" type="button" data-r="mClose">Done</button></div>' +
        '<div class="field"><label class="label" for="gts-name">Name</label><input class="input" id="gts-name" data-r="nameIn" type="text" maxlength="16" autocomplete="off"></div>' +
        '<div class="field"><span class="label">Picture</span>' +
          '<div class="presets" data-r="avGrid"></div>' +
          '<div class="row"><input class="file" data-r="avFile" id="gts-avfile" type="file" accept="image/*"><label class="btn" for="gts-avfile">Upload picture</label><button class="btn" type="button" data-r="avClear">Use emoji</button></div>' +
          '<p class="hint" data-r="avNote"></p></div>' +
      '</div></dialog>';
    $('boards').appendChild(root);
    function q(r) { return root.querySelector('[data-r="' + r + '"]'); }

    /* ----- game logic ----- */
    function rowEarned(s) { var n = 0; for (var c = 0; c < S.cols; c++) if (S.filled[s][c] === 1) n++; return n; }
    function rowDone(s) { for (var c = 0; c < S.cols; c++) if (!S.filled[s][c]) return false; return true; }   // every box marked (token or X)
    function doneRows() { var n = 0; for (var s = 0; s < S.n; s++) if (rowDone(s)) n++; return n; }
    function allDone() { return doneRows() === S.n; }
    function nameOf(s) { return (S.names[s] || '').trim() || ('Student ' + (s + 1)); }

    /* ----- pictures: avatars and the next activity ----- */
    var avBlobs = [], avURLs = [], avOK = [], nextBlob = null, nextURL = '', nextOK = true;
    function dropAv(i) { if (avURLs[i]) URL.revokeObjectURL(avURLs[i]); avBlobs[i] = null; avURLs[i] = ''; avOK[i] = true; idbDel('group-av-' + i).catch(function () {}); }
    function setNext(b) { if (nextURL) URL.revokeObjectURL(nextURL); nextBlob = b; nextURL = b ? URL.createObjectURL(b) : ''; }
    function dropNext() { setNext(null); nextOK = true; idbDel('group-next').catch(function () {}); }

    function avatarEl(s) {
      var d = document.createElement('span'); d.className = 'gav';
      var a = S.av[s];
      if (a.t === 'upload' && avURLs[s]) { var im = document.createElement('img'); im.alt = ''; im.src = avURLs[s]; d.appendChild(im); }
      else d.textContent = AVS[a.t === 'emoji' ? a.e : s % 10][0];
      d.setAttribute('aria-hidden', 'true');
      return d;
    }
    function fillNextPic(box) {
      box.innerHTML = '';
      var p = S.nextPic;
      if (p && p.type === 'upload' && nextURL) { var im = document.createElement('img'); im.alt = ''; im.src = nextURL; box.appendChild(im); }
      else if (p && p.type === 'pictogram') {
        var pi = document.createElement('img'); pi.className = 'pict'; pi.alt = p.word || '';
        pi.onerror = function () { box.innerHTML = ''; box.appendChild(emptyNote('Pictogram could not load')); };
        pi.src = pictoUrl(p.id); box.appendChild(pi);
      } else box.appendChild(emptyNote('Add a picture'));
    }
    function flowBox(label, win) {
      var b = document.createElement('div'); b.className = 'fbox' + (win ? ' win' : '');
      var pic = document.createElement('div'); pic.className = 'fpic';
      var lab = document.createElement('div'); lab.className = 'flabel';
      lab.textContent = label; if (label.length > 14) lab.className += ' long';
      b.appendChild(pic); b.appendChild(lab);
      return { box: b, pic: pic };
    }

    /* ----- rendering ----- */
    function tokBtn(s, c) {
      var b = document.createElement('button'), st = S.filled[s][c];
      b.type = 'button'; b.className = 'gtok'; b.dataset.s = s; b.dataset.c = c;
      b.setAttribute('aria-pressed', st ? 'true' : 'false');
      b.setAttribute('aria-label', nameOf(s) + ', box ' + (c + 1) + (st === 1 ? ', token' : st === 2 ? ', crossed' : ', empty'));
      b.innerHTML = st === 1 ? icon(S.style) : st === 2 ? X_SVG : icon(S.style);
      if (justKey === s + '-' + c && b.firstChild) b.firstChild.classList.add('pop');
      return b;
    }
    function renderStage() {
      var fit = q('fit'), cols = S.cols;
      var tcol = S.tally ? 1 : 0, d = Math.max(1.5, Math.min(3, (2.8 + cols + tcol) * 0.2));
      var wU = 2.8 + cols + tcol + 0.5, hU = S.n + 0.5 + (S.showFlow ? 0.35 + d * 1.3 : 0);
      fit.style.setProperty('--ratio', (wU / hU).toFixed(4));
      fit.innerHTML = '';
      var card = document.createElement('div'); card.className = 'gt-card';
      card.style.setProperty('--units', wU.toFixed(2)); card.style.setProperty('--d', d.toFixed(2));
      var grid = document.createElement('div'); grid.className = 'gt-grid';
      grid.style.gridTemplateColumns = '2.8fr repeat(' + (cols + tcol) + ', 1fr)';
      grid.setAttribute('role', 'group'); grid.setAttribute('aria-label', 'Students and tokens');
      for (var s = 0; s < S.n; s++) {
        var done = rowDone(s), nm = nameOf(s);
        var nb = document.createElement('button');
        nb.type = 'button'; nb.className = 'gname' + (done ? ' gdone' : ''); nb.dataset.s = s;
        nb.setAttribute('aria-label', 'Edit ' + nm);
        nb.appendChild(avatarEl(s));
        var sp = document.createElement('span'); sp.className = 'gn' + (nm.length > 11 ? ' long' : ''); sp.textContent = nm;
        nb.appendChild(sp); grid.appendChild(nb);
        for (var c = 0; c < cols; c++) grid.appendChild(tokBtn(s, c));
        if (S.tally) {
          var t = document.createElement('div'), tl = rowEarned(s); t.className = 'gtally' + (done ? ' gdone' : '');
          t.textContent = tl; t.setAttribute('role', 'img');
          t.setAttribute('aria-label', nm + ' has ' + tl + (tl === 1 ? ' token' : ' tokens'));
          grid.appendChild(t);
        }
      }
      card.appendChild(grid);
      if (S.showFlow) {
        var flow = document.createElement('div'); flow.className = 'gt-flow';
        var fin = flowBox('Finished', allDone());
        var fi = document.createElement('img'); fi.className = 'pict'; fi.alt = '';
        fi.onerror = function () { fin.pic.innerHTML = CHECK_SVG; };
        fi.src = FINISHED_SRC; fin.pic.appendChild(fi);
        var arrow = document.createElement('span'); arrow.className = 'farrow'; arrow.innerHTML = ARROW_SVG;
        var nx = flowBox((S.nextText || '').trim() || 'Next activity', false);
        fillNextPic(nx.pic);
        flow.appendChild(fin.box); flow.appendChild(arrow); flow.appendChild(nx.box);
        flow.setAttribute('aria-label', 'Finished, then ' + ((S.nextText || '').trim() || 'next activity'));
        card.appendChild(flow);
      }
      fit.appendChild(card);
    }
    function renderStatus() {
      var total = S.n * S.cols, e = 0, marked = 0, fin = doneRows(), all = fin === S.n;
      for (var s = 0; s < S.n; s++) for (var c = 0; c < S.cols; c++) { if (S.filled[s][c] === 1) e++; if (S.filled[s][c]) marked++; }
      q('progText').textContent = e + ' of ' + total + ' tokens';
      q('progLeft').textContent = all ? 'Everyone finished' : fin + ' of ' + S.n + ' finished';
      q('meter').style.width = (marked / total * 100) + '%';
      q('reset').disabled = marked === 0;
      q('done').hidden = !all;
      var nt = (S.nextText || '').trim();
      q('doneText').textContent = 'Everyone is finished.' + (nt ? ' Next: ' + nt + '.' : ' Time for the next activity.');
    }

    var search;
    function renderModal() {
      var m = q('modal'); if (!m.open) return;
      if (sel >= S.n) sel = S.n - 1;
      q('mTitle').textContent = 'Edit student ' + (sel + 1);
      var nameIn = q('nameIn'); nameIn.placeholder = 'Student ' + (sel + 1);
      if (nameIn !== document.activeElement) nameIn.value = S.names[sel];
      var a = S.av[sel];
      q('avGrid').querySelectorAll('.preset').forEach(function (b) { b.setAttribute('aria-pressed', a.t === 'emoji' && a.e === +b.dataset.e ? 'true' : 'false'); });
      q('avClear').disabled = a.t !== 'upload';
      q('avNote').textContent = a.t === 'upload' && avBlobs[sel]
        ? 'Saved picture uses ' + fmtSize(avBlobs[sel].size) + (avOK[sel] === false ? ', for this visit only.' : '.')
        : 'Choose an emoji or upload a picture.';
    }
    function renderPanel() {
      q('cOut').textContent = S.cols; q('cMinus').disabled = S.cols <= 1; q('cPlus').disabled = S.cols >= MAXC;
      root.querySelectorAll('[data-r="tallySeg"] button').forEach(function (b) { b.setAttribute('aria-pressed', (b.dataset.tally === 'on') === S.tally ? 'true' : 'false'); });
      q('tallyHint').textContent = S.tally ? 'An extra column after the tokens counts each student\u2019s tokens. Crosses are not counted.' : 'No extra column.';
      root.querySelectorAll('[data-r="styleRow"] button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.style === S.style ? 'true' : 'false'); });
      root.querySelectorAll('[data-r="showSeg"] button').forEach(function (b) { b.setAttribute('aria-pressed', (b.dataset.show === 'yes') === S.showFlow ? 'true' : 'false'); });
      q('nextStack').hidden = !S.showFlow;
      if (q('nextIn') !== document.activeElement) q('nextIn').value = S.nextText;
      q('nextClear').disabled = !S.nextPic;
      var np = S.nextPic, note = 'Uploads are shrunk to a small WebP before saving.';
      if (np && np.type === 'upload' && nextBlob) note = 'Saved picture uses ' + fmtSize(nextBlob.size) + (nextOK ? '.' : ', for this visit only.');
      else if (np && np.type === 'pictogram') note = 'Pictogram saved as a link, under 1 KB.';
      q('nextNote').textContent = note;
      search.render();
      renderModal();
    }
    function refresh() { renderStage(); justKey = ''; renderStatus(); }
    function renderAll() { refresh(); renderPanel(); }

    /* ----- one-time panel pieces ----- */
    AVS.forEach(function (p, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'preset'; b.dataset.e = i; b.title = p[1];
      b.setAttribute('aria-label', 'Use ' + p[1] + ' picture');
      var box = document.createElement('span'); box.className = 'pimg emo'; box.textContent = p[0]; b.appendChild(box);
      b.addEventListener('click', function () {
        if (S.av[sel].t === 'upload') dropAv(sel);
        S.av[sel] = { t: 'emoji', e: i }; save(); renderAll();
      });
      q('avGrid').appendChild(b);
    });
    Object.keys(STYLES).forEach(function (k) {
      var b = document.createElement('button');
      b.type = 'button'; b.dataset.style = k;
      b.innerHTML = icon(k) + '<span>' + STYLES[k].label + '</span>';
      b.addEventListener('click', function () { S.style = k; save(); renderAll(); });
      q('styleRow').appendChild(b);
    });
    search = wireSearch(
      { form: q('nextForm'), input: q('nextSearch'), status: q('nextStatus'), results: q('nextResults') },
      function (r) { dropNext(); S.nextPic = { type: 'pictogram', id: r.id, word: r.word }; save(); renderAll(); },
      function (r) { return !!(S.nextPic && S.nextPic.type === 'pictogram' && S.nextPic.id === r.id); }
    );

    /* ----- events ----- */
    q('fit').addEventListener('click', function (ev) {
      var t = ev.target.closest('.gtok');
      if (t) {
        var s = +t.dataset.s, c = +t.dataset.c;
        S.filled[s][c] = (S.filled[s][c] + 1) % 3;      // empty -> token -> cross -> empty
        var st = S.filled[s][c];
        if (st) justKey = s + '-' + c;
        save(); renderStage(); renderStatus(); justKey = '';
        if (st && allDone()) SOUND.complete(); else if (st === 1) SOUND.token();
        return;
      }
      var n = ev.target.closest('.gname');
      if (n) openModal(+n.dataset.s);
    });
    var modal = q('modal'), lastOpener = -1;
    function openModal(s) {
      sel = s; lastOpener = s;
      if (!modal.open) modal.showModal();
      renderModal();
      q('nameIn').focus(); q('nameIn').select();
    }
    q('mClose').addEventListener('click', function () { modal.close(); });
    modal.addEventListener('click', function (e) { if (e.target === modal) modal.close(); });
    modal.addEventListener('keydown', function (e) { if (e.key === 'Escape') e.stopPropagation(); });
    modal.addEventListener('close', function () {
      var b = root.querySelector('.gname[data-s="' + lastOpener + '"]'); if (b) b.focus();
    });
    q('sound').addEventListener('click', toggleSound);
    function resetAll() { for (var s = 0; s < MAXS; s++) for (var c = 0; c < MAXC; c++) S.filled[s][c] = 0; save(); renderAll(); }
    q('reset').addEventListener('click', resetAll);
    q('again').addEventListener('click', resetAll);
    q('present').addEventListener('click', function () { document.body.classList.add('present'); });
    q('exit').addEventListener('click', function () { document.body.classList.remove('present'); });

    q('sMinus').addEventListener('click', function () { S.n = clamp(S.n - 1, 2, MAXS); save(); renderAll(); });
    q('sPlus').addEventListener('click', function () { S.n = clamp(S.n + 1, 2, MAXS); save(); renderAll(); });
    q('cMinus').addEventListener('click', function () { S.cols = clamp(S.cols - 1, 1, MAXC); save(); renderAll(); });
    q('cPlus').addEventListener('click', function () { S.cols = clamp(S.cols + 1, 1, MAXC); save(); renderAll(); });
    root.querySelectorAll('[data-r="tallySeg"] button').forEach(function (b) {
      b.addEventListener('click', function () { S.tally = b.dataset.tally === 'on'; save(); renderAll(); });
    });
    root.querySelectorAll('[data-r="showSeg"] button').forEach(function (b) {
      b.addEventListener('click', function () { S.showFlow = b.dataset.show === 'yes'; save(); renderAll(); });
    });
    q('nameIn').addEventListener('input', function (e) {
      S.names[sel] = e.target.value.slice(0, 16); save(); refresh();
    });
    q('nextIn').addEventListener('input', function (e) { S.nextText = e.target.value.slice(0, 30); save(); refresh(); });

    q('avFile').addEventListener('change', function () {
      var input = this, f = input.files && input.files[0], i = sel; if (!f) return;
      q('avNote').textContent = 'Shrinking picture…';
      shrink(f).then(function (blob) {
        if (!blob) throw new Error('empty');
        dropAv(i); avBlobs[i] = blob; avURLs[i] = URL.createObjectURL(blob); avOK[i] = true;
        S.av[i] = { t: 'upload' }; save(); renderAll();
        idbSet('group-av-' + i, blob).catch(function () { avOK[i] = false; renderPanel(); });
      }).catch(function () { q('avNote').textContent = 'That file could not be read as a picture. Try a JPG or PNG.'; });
      input.value = '';
    });
    q('avClear').addEventListener('click', function () { dropAv(sel); S.av[sel] = { t: 'emoji', e: sel % 10 }; save(); renderAll(); });

    q('nextFile').addEventListener('change', function () {
      var input = this, f = input.files && input.files[0]; if (!f) return;
      q('nextNote').textContent = 'Shrinking picture…';
      shrink(f).then(function (blob) {
        if (!blob) throw new Error('empty');
        setNext(blob); nextOK = true; S.nextPic = { type: 'upload' }; save(); renderAll();
        idbSet('group-next', blob).catch(function () { nextOK = false; renderPanel(); });
      }).catch(function () { q('nextNote').textContent = 'That file could not be read as a picture. Try a JPG or PNG.'; });
      input.value = '';
    });
    q('nextClear').addEventListener('click', function () { S.nextPic = null; dropNext(); save(); renderAll(); });

    renderAll();
    // bring back saved uploads
    S.av.forEach(function (a, i) {
      if (a.t !== 'upload') return;
      idbGet('group-av-' + i).then(function (b) {
        if (b) { avBlobs[i] = b; avURLs[i] = URL.createObjectURL(b); }
        else { S.av[i] = { t: 'emoji', e: i % 10 }; save(); }
        renderAll();
      }).catch(function () { S.av[i] = { t: 'emoji', e: i % 10 }; save(); renderAll(); });
    });
    if (S.nextPic && S.nextPic.type === 'upload') {
      idbGet('group-next').then(function (b) {
        if (b) setNext(b); else { S.nextPic = null; save(); }
        renderAll();
      }).catch(function () { S.nextPic = null; save(); renderAll(); });
    }
    boards.push({ root: root, hash: 'group-token-system' });
  })();

  /* ---------- routing ---------- */
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.body.classList.remove('present'); });
  function route() {
    var h = (location.hash || '').replace('#', '');
    var active = null;
    boards.forEach(function (b) { if (b.hash === h) active = b; });
    $('landing').hidden = !!active;
    $('backLink').hidden = !active;
    boards.forEach(function (b) { b.root.hidden = b !== active; });
    if (!active) document.body.classList.remove('present');
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  updateSoundButtons();
  route();
})();
</script>

</body></html>
